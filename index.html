<style>
.nrg{--bg:#000;--fg:#fff;--g1:#b3b3b3;--g2:#7a7a7a;--g3:#3a3a3a;--g4:#1a1a1a;--ac:#4599C8;
 background:var(--bg);color:var(--fg);font-family:inherit;font-family:'Roboto Condensed','Arial Narrow',Roboto,Arial,sans-serif;
 width:100%;height:100vh;min-height:640px;max-height:980px;display:flex;flex-direction:column;box-sizing:border-box;padding:28px 32px 24px;overflow:hidden;-webkit-font-smoothing:antialiased}
.nrg *{box-sizing:border-box}
.nrg{position:relative}
.nrg-sign{position:absolute;right:32px;bottom:6px;display:flex;align-items:center;gap:16px;font-size:13px;letter-spacing:.04em;z-index:2;background:#000;padding-left:12px}
.nrg-sign a{color:var(--ac);text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.nrg-sign a:hover{color:#fff}
.nrg-ver{color:var(--g2);font-size:12px}

.nrg-bar{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;padding-bottom:16px;border-bottom:1px solid var(--g3)}
.nrg-kicker{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ac);margin-bottom:8px}
.nrg-title{font-size:26px;line-height:1.15;font-weight:500;letter-spacing:.01em;text-transform:uppercase}
.nrg-q{background:transparent;border:1px solid var(--g3);color:var(--fg);font:inherit;font-size:14px;padding:10px 14px;width:280px;outline:none;border-radius:0}
.nrg-q:focus{border-color:var(--ac)}
.nrg-q::placeholder{color:var(--g2)}
.nrg-filters{display:flex;flex-wrap:wrap;gap:6px;padding:14px 0}
.nrg-chip{background:transparent;border:1px solid var(--g3);color:var(--g1);font:inherit;font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:7px 12px;cursor:pointer;border-radius:0;transition:border-color .15s,color .15s,background .15s}
.nrg-chip:hover{border-color:var(--g1);color:var(--fg)}
.nrg-chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.nrg-main{flex:1;display:flex;min-height:0;border-top:1px solid var(--g3)}
.nrg-stage{position:relative;flex:1;min-width:0}
.nrg-stage svg{width:100%;height:calc(100% - 30px);display:block;cursor:grab}
.nrg-stage svg:active{cursor:grabbing}
.nrg-legend{position:absolute;left:0;bottom:4px;display:flex;flex-wrap:wrap;gap:16px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--g2);pointer-events:none}
.nrg-legend i{display:inline-block;vertical-align:-1px;margin-right:6px}
.nrg-lg-d{width:11px;height:11px;border:1.5px solid #fff;border-radius:50%}
.nrg-lg-c{width:8px;height:8px;background:var(--g1);border-radius:50%}
.nrg-lg-w{width:10px;height:10px;border:1.5px dashed var(--g1);border-radius:50%}
.nrg-reset{position:absolute;right:16px;top:12px;background:transparent;border:1px solid var(--g3);color:var(--g1);font:inherit;font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:6px 10px;cursor:pointer;border-radius:0}
.nrg-reset:hover{border-color:var(--ac);color:#fff}
.nrg-panel{-webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 48px),transparent);mask-image:linear-gradient(to bottom,#000 calc(100% - 48px),transparent);padding-bottom:56px !important;width:420px;flex:none;border-left:1px solid var(--g3);padding:22px 4px 22px 26px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--g3) transparent}
.nrg-panel::-webkit-scrollbar{width:6px}.nrg-panel::-webkit-scrollbar-thumb{background:var(--g3)}
.nrg-p-id{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ac)}
.nrg-p-h{font-size:22px;line-height:1.2;font-weight:500;margin:8px 0 6px}
.nrg-p-sub{font-size:13px;color:var(--g2);margin-bottom:16px}
.nrg-meta{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--g3);border:1px solid var(--g3);margin-bottom:18px}
.nrg-meta div{background:#000;padding:10px 12px}
.nrg-meta b{display:block;font-weight:400;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--g2);margin-bottom:4px}
.nrg-meta span{font-size:14px}
.nrg-meta .w{color:var(--ac)}
.nrg-sec{margin:0 0 16px}
.nrg-sec h4{margin:0 0 6px;font-size:11px;font-weight:400;letter-spacing:.14em;text-transform:uppercase;color:var(--g2)}
.nrg-sec p{margin:0;font-size:14px;line-height:1.55;color:#e6e6e6}
.nrg-sec p.q{color:var(--g1);border-left:2px solid var(--ac);padding-left:12px}
.nrg-tbd{width:100%;border-collapse:collapse;font-size:13px}
.nrg-tbd td{border-top:1px solid var(--g3);padding:8px 8px 8px 0;vertical-align:top;line-height:1.4;color:#e6e6e6}
.nrg-tbd td.c{white-space:nowrap;color:var(--ac);width:64px}
.nrg-tbd td.s{color:var(--g2);width:110px}
.nrg-rel{display:flex;flex-wrap:wrap;gap:6px}
.nrg-rel button{background:transparent;border:1px solid var(--g3);color:var(--g1);font:inherit;font-size:12px;padding:5px 8px;cursor:pointer;border-radius:0}
.nrg-rel button:hover{border-color:var(--ac);color:#fff}
.nrg-src a{display:block;color:var(--g1);font-size:13px;line-height:1.4;padding:6px 0;border-top:1px solid var(--g3);text-decoration:none}
.nrg-src a:hover{color:var(--ac)}
.nrg-list{list-style:none;margin:0;padding:0}
.nrg-list li{border-top:1px solid var(--g3);padding:9px 0;font-size:13px;line-height:1.4;cursor:pointer;display:grid;grid-template-columns:70px 1fr;gap:8px;color:#e6e6e6}
.nrg-list li:hover{color:#fff}.nrg-list li:hover .k{color:#fff}
.nrg-list .k{color:var(--ac)}
.nrg-list .m{grid-column:2;color:var(--g2);font-size:12px}
.nrg-note{font-size:11px;color:var(--g2);line-height:1.5;margin-top:18px;border-top:1px solid var(--g3);padding-top:12px}
.nrg-back{background:none;border:0;color:var(--g2);font:inherit;font-size:11px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;padding:0;margin-bottom:14px}
.nrg-back:hover{color:var(--ac)}
.nrg-node{cursor:pointer}
.nrg-node text{pointer-events:none;font-family:inherit;paint-order:stroke;stroke:#000;stroke-width:3px;stroke-linejoin:round}
.nrg :focus-visible{outline:1px solid var(--ac);outline-offset:2px}
@media (max-width:900px){
 .nrg{height:auto;max-height:none;padding:20px 16px}
 .nrg-bar{flex-direction:column;align-items:stretch}
 .nrg-q{width:100%}
 .nrg-title{font-size:20px}
 .nrg-main{flex-direction:column}
 .nrg-stage{height:78vw;min-height:380px;max-height:560px;flex:none}
 .nrg-panel{-webkit-mask-image:none;mask-image:none;width:100%;border-left:0;border-top:1px solid var(--g3);padding:18px 0;max-height:none;overflow:visible}
 .nrg-hint{display:none}
 .nrg-dn{display:none}
 .nrg-sign{position:static;justify-content:flex-end;flex-wrap:wrap;padding:12px 0 0}
}
</style>
<script>
(function(){
var DATA={"nodes":[{"id":"GOV","type":"domain","name":"Управление рисками ИИ и системы менеджмента","desc":"Рамки программ, системы менеджмента и каталоги контролей: от NIST AI RMF до ISO/IEC 42001 и CSA AICM."},{"id":"REG","type":"domain","name":"Регуляторика ЕС","desc":"Обязательные режимы ЕС, которые задают требования к ИИ-системам, данным, ИБ и устойчивости."},{"id":"ZTA","type":"domain","name":"Zero Trust и архитектура агентов","desc":"Принципы, модели зрелости и референсные архитектуры zero trust в применении к ИИ-агентам."},{"id":"IAM","type":"domain","name":"Идентичность и авторизация агентов","desc":"Как агент получает собственную идентичность, делегированные права и подотчётность."},{"id":"PRT","type":"domain","name":"Протоколы агентов","desc":"Безопасность подключения агентов к инструментам (MCP) и друг к другу (A2A)."},{"id":"SCM","type":"domain","name":"Цепочка поставок ИИ","desc":"Инвентаризация, происхождение и целостность моделей, данных, инструментов и зависимостей."},{"id":"THR","type":"domain","name":"Угрозы и моделирование угроз","desc":"Таксономии рисков, базы техник атак и методики threat modeling."},{"id":"DEF","type":"domain","name":"Защитные паттерны","desc":"Технические и архитектурные приёмы защиты агентов от prompt injection."},{"id":"TST","type":"domain","name":"Тестирование и red teaming","desc":"Методики и бенчмарки состязательного тестирования агентов."},{"id":"VRM","type":"domain","name":"Уязвимости и количественная оценка риска","desc":"Оценка тяжести, приоритизация, данные об эксплуатации и риск в деньгах."},{"id":"ASR","type":"domain","name":"Assurance, сертификация и закупки","desc":"Независимое подтверждение и критерии выбора поставщиков."},{"id":"GOV-01","type":"card","domain":"GOV","short":"NIST AI RMF 1.0 и GenAI Profile (AI 600-1)","title":"NIST AI RMF (AI Risk Management Framework) + AI 600-1 GenAI Profile","status":"Под наблюдением","next":"2027-01","kind":"governance и риск-менеджмент. Это добровольный фреймворк управления рисками ИИ на всём жизненном цикле.","core":"ядро фреймворка (Core) состоит из четырёх функций: GOVERN: культура, политики, роли и ответственность; MAP: контекст, назначение системы и выявление рисков; MEASURE: тестирование, метрики, оценка; MANAGE: приоритизация, обработка и мониторинг рисков. Core требует тестировать систему до развёртывания и регулярно во время эксплуатации, в том числе в условиях, близких к боевым. Профили, например 600-1, адаптируют ядро под класс систем.","jtbd":"«Мне нужна признанная рамка, по которой можно выстроить программу управления рисками ИИ: кто отвечает, как риски выявляются, измеряются и обрабатываются. Тогда отдельные инструменты (OWASP, ATLAS, AIVSS, FAIR) складываются в систему, которую понимают аудиторы и регуляторы».","level":"стратегический (программа и governance) и тактический (процессы).","sec":"AI RMF служит «зонтиком», который связывает разрозненные инструменты в программу. Роль CISO: владелец рисков в MEASURE и MANAGE, соавтор GOVERN.","biz":"признанная рамка для совета, аудиторов и клиентов. Фреймворк хорошо сопоставляется с ISO 42001 и EU AI Act.","lim":"Фреймворк добровольный и высокоуровневый: он говорит, что делать, но не как именно. AI 600-1 писался под GenAI, а не под агентов. Агентные оверлеи COSAiS на апрель 2026 года ещё в разработке, сроков публикации нет. Версия 1.0 пересматривается, поэтому структура может измениться. Типичные ошибки: превратить фреймворк в бумажный чек-лист без MEASURE","tbd":[{"w":"Пересмотр AI RMF 1.0; черновик Zero Draft (июль 2026)","s":"срок не объявлен","c":"2027-01"},{"w":"NIST COSAiS: оверлеи SP 800-53 для одного и нескольких агентов","s":"срок не объявлен","c":"2027-01"}],"src":[{"n":"NIST: AI Risk Management Framework","u":"https://www.nist.gov/itl/ai-risk-management-framework"},{"n":"NIST AI 600-1 (PDF)","u":"https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.600-1.pdf"},{"n":"NIST: AI Agent Standards Initiative","u":"https://www.nist.gov/news-events/news/2026/02/announcing-ai-agent-standards-initiative-interoperable-and-secure"},{"n":"CSA: NIST, стандарты для агентов и COSAiS","u":"https://labs.cloudsecurityalliance.org/research/csa-research-note-nist-ai-agent-standards-federal-framework/"}],"rel":["GOV-02","GOV-03","GOV-05","GOV-07","REG-01","ZTA-01","ZTA-06","IAM-01","IAM-02","PRT-01","PRT-02","SCM-01","SCM-02","SCM-03","THR-01","THR-03","THR-05","VRM-01","VRM-02","VRM-03","VRM-04"],"lab":"NIST AI RMF"},{"id":"GOV-02","type":"card","domain":"GOV","short":"CSA NIST AI RMF Agentic Profile","title":"NIST AI RMF: Agentic Profile (CSA, черновик)","status":"Черновик источника","next":"2026-12","kind":"гибрид (AI governance / ИБ)","core":"расширения GOV-01 по четырём функциям под агентный ИИ. Добавляются уровни автономии, модель рисков инструментов, runtime-метрики поведения и контроль цепочек делегирования, IR и вывод агентов из эксплуатации. Расширения дополняют RMF, а не заменяют его, и получают префикс «AG».","jtbd":"«Когда организация уже управляет ИИ по NIST AI RMF и начинает внедрять автономных агентов, я хочу расширить существующую программу, чтобы надзор и ответственность росли вместе с автономией агента».","level":"стратегический (GOVERN) и тактический.","sec":"ключевая роль в AG-GV.3 (реестр агентов в IAM), AG-MP.1 (риск инструментов), AG-MS.1/3 и AG-MG.1. Роль: technical owner по безопасности. Veto: на повышение уровня автономии без калибровки.","biz":"у каждого агента должен быть business owner, отвечающий за его поведение. Привлекать безопасность при классификации уровня и при любом расширении набора инструментов.","lim":"документ в статусе draft, не официальный NIST и может разойтись с будущим профилем NIST. Частоты калибровки и границы уровней: предложение авторов, а не стандарт. Описание AAGATE (GOA, Janus SMA, Tool-Gateway, ANS на DID/SPIFFE) частично вендорски-концептуальное. Автоматический kill switch конфликтует с правилом ZTA-01 «люди принимают решения об изоляции».","tbd":[{"w":"Финальная версия CSA Agentic Profile (сейчас draft от 27.03.2026)","s":"срок не объявлен","c":"2027-03"},{"w":"NIST AI Agent Interoperability Profile","s":"IV кв. 2026 (план NIST)","c":"2026-12"}],"src":[{"n":"CSA Labs: NIST AI RMF Agentic Profile","u":"https://labs.cloudsecurityalliance.org/agentic/agentic-nist-ai-rmf-profile-v1/"}],"rel":["GOV-01","GOV-07","ZTA-01","ZTA-06","IAM-01","THR-01","THR-03","THR-04"],"lab":"CSA Agentic Profile"},{"id":"GOV-03","type":"card","domain":"GOV","short":"ISO/IEC 42001 (AIMS)","title":"ISO/IEC 42001 (AI Management System, AIMS) и семейство 42000","status":"Актуально","next":"2027-03","kind":"governance, сертифицируемая система менеджмента ИИ.","core":"стандарт задаёт требования к созданию, внедрению, поддержке и постоянному улучшению AIMS. Сертифицируется система менеджмента, а не отдельная модель, продукт или результат. Требования делятся на два слоя: Разделы 4–10 обязательны и проверяются аудитором: контекст, лидерство, планирование, поддержка, операционная деятельность, оценка результатов, улучшение. Annex A: справочный каталог из 38 контролей в 9 целях (A.2–A.10).","jtbd":"«Клиенты, партнёры и регуляторы спрашивают, как мы управляем ИИ. Нужен признанный международный сертификат и выстроенная система, в которую встраиваются политики, оценки воздействия, контроли агентов и работа с поставщиками. Тогда на каждый запрос не придётся собирать доказательства с нуля».","level":"стратегический (система менеджмента, сертификация) и тактический (процессы и контроли).","sec":"AIMS становится рамкой, в которую CISO встраивает все технические контроли агентов как доказательства. Роль CISO: владелец ряда контролей A.6, A.7 и A.10 и участник анализа со стороны руководства.","biz":"Признанный сертификат для клиентов, партнёров и тендеров. Основа для соответствия EU AI Act вместе с EN 18286. Сокращает работу с анкетами вендоров.","lim":"Сертификат подтверждает систему менеджмента, а не безопасность конкретного агента. Annex A написан для ИИ в целом, а не для агентов, поэтому агентные контроли приходится добавлять самостоятельно. Сам по себе ISO 42001 не означает соответствия AI Act: для высокорисковых систем нужен EN 18286.","tbd":[{"w":"Новые гармонизированные стандарты AI Act поверх 42001 (после EN 18286)","s":"по графику CEN-CENELEC JTC 21","c":"2027-03"}],"src":[{"n":"Еврокомиссия: первый гармонизированный стандарт AI Act","u":"https://digital-strategy.ec.europa.eu/en/library/first-harmonised-standard-supporting-ai-act-published-official-journal"},{"n":"CSA: prEN 18286 и ISO 42001","u":"https://labs.cloudsecurityalliance.org/wp-content/uploads/2026/04/CSA_research_note_eu_ai_act_pren_18286_iso_42001_20260428-csa-styled.pdf"}],"rel":["GOV-01","GOV-04","GOV-05","GOV-06","GOV-07","REG-01","ZTA-01","PRT-01","SCM-01","SCM-02","SCM-03","THR-01","THR-03","VRM-04","ASR-01"],"lab":"ISO/IEC 42001"},{"id":"GOV-04","type":"card","domain":"GOV","short":"ISO/IEC 42005 (оценка воздействия ИИ)","title":"ISO/IEC 42005:2025: оценка воздействия ИИ-систем (AI System Impact Assessment)","status":"Актуально","next":"2027-03","kind":"governance, методика оценки воздействия ИИ на людей, группы и общество.","core":"стандарт объясняет, как оценивать влияние ИИ-системы и её предсказуемых применений на людей, группы и общество. Оценку рекомендуется проводить на всём жизненном цикле, от проектирования до мониторинга после вывода на рынок, и обновлять её при изменениях. Стандарт состоит из двух частей: Раздел 5 (процесс, 12 подразделов): сроки, область, распределение ответственности, пороги для чувствительных и запрещённых применений, утверждение, мониторинг и пересмотр.","jtbd":"«Перед запуском агента, который работает с клиентами, мне нужно понять, кому и как он может навредить: дискриминация, отказ в услуге, утечка, ошибочное действие. Нужно задокументировать меры так, чтобы одна оценка закрыла и ISO 42001, и FRIA по AI Act, и часть DPIA».","level":"тактический (оценка каждой системы) и стратегический (пороги и политика).","sec":"CISO вносит в оценку security-вред, сценарии злоупотреблений и технические меры. Это включает security в governance, а не оставляет его «отдельной проверкой».","biz":"единая методика заменяет разрозненные FRIA, DPIA и этические анкеты. Ускоряет вывод систем и упрощает аудит, потому что записи сопоставимы между собой.","lim":"Стандарт даёт рекомендации, а не требования, и сам по себе не закрывает ст. 27: уведомление и шаблон регулятора нужно делать отдельно. Стандарт не специализирован под агентов, поэтому агентные воздействия нужно добавлять самостоятельно. Типичные ошибки: оценка один раз перед запуском без пересмотра; одинаковая глубина для всех систем","tbd":[{"w":"Официальный шаблон FRIA от AI Office и практика надзорных органов","s":"обязательства ст. 27 действуют с августа 2026","c":"2026-12"}],"src":[{"n":"ISO/IEC 42005:2025","u":"https://www.iso.org/standard/42005"},{"n":"AI Act Service Desk: ст. 27","u":"https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-27"}],"rel":["GOV-01","GOV-03","GOV-05","REG-01","REG-02","THR-01","THR-03","DEF-01","VRM-04"],"lab":"ISO/IEC 42005"},{"id":"GOV-05","type":"card","domain":"GOV","short":"ISO/IEC 23894 (риск-менеджмент ИИ)","title":"ISO/IEC 23894:2023 (Information technology: Artificial intelligence, Guidance on risk management)","status":"Актуально","next":"2027-06","kind":"управленческий / гибрид (риск-менеджмент ИИ)","core":"берёт принципы, рамку и процесс ISO 31000 и дополняет их тем, что специфично для ИИ: цели, источники риска, привязка к этапам жизненного цикла. Это руководство: сертифицироваться по нему нельзя.","jtbd":"«Когда в компании уже есть риск-менеджмент по ISO 31000 или ERM, я хочу встроить в него риски ИИ, не строя отдельную систему, чтобы ИИ-риски оценивались по тем же критериям и попадали в общий реестр».","level":"стратегический (рамка, Clause 5) / тактический (процесс, Clause 6).","sec":"CISO владеет целью security и источниками риска, связанными с атаками. Его задача: чтобы ИИ-риски безопасности попадали в общий реестр, а не жили в отдельной таблице. Роль: соисполнитель.","biz":"для риск-функции и совета это знакомый язык ISO 31000. Стандарт полезен там, где ERM уже есть и нужно быстро охватить ИИ.","lim":"Стандарт рекомендательный, конкретных контролей и метрик нет. Текст платный. Агентной специфики и GenAI в нём нет, их закрывают GOV-01 и GOV-02. Типичные ошибки: путать с ISO 42005: 23894 смотрит на риск для организации, 42005 – на воздействие на людей; вести отдельный ИИ-реестр рядом с ERM; считать Annex B исчерпывающим","tbd":[{"w":"Пересмотр ISO/IEC 23894","s":"не объявлен","c":"2027-06"}],"src":[{"n":"ISO/IEC 23894:2023","u":"https://www.iso.org/standard/77304.html"}],"rel":["GOV-01","GOV-02","GOV-03","GOV-04","THR-01","THR-02","THR-03","THR-05","THR-07"],"lab":"ISO/IEC 23894"},{"id":"GOV-06","type":"card","domain":"GOV","short":"ISO/IEC 27001 (ISMS)","title":"ISO/IEC 27001:2022 (Information security, cybersecurity and privacy protection: ISMS requirements)","status":"Актуально","next":"2027-06","kind":"управленческий / ИБ (система менеджмента ИБ, сертифицируемая)","core":"это требования к системе менеджмента ИБ, а не каталог мер. Clauses 4–10 задают цикл управления: контекст, лидерство, планирование и оценка рисков, поддержка, операции, оценка эффективности, улучшение. Annex A содержит 93 референсных контроля. Организация выбирает из них нужные по итогам оценки рисков и обосновывает выбор в SoA.","jtbd":"«Когда клиенты, регуляторы или партнёры требуют доказать управляемую ИБ, я хочу выстроить риск-ориентированную систему управления и подтвердить её сертификатом, чтобы проходить закупки и надзор и иметь общую основу для NIS2, DORA, GDPR и ISO 42001».","level":"стратегический (Clauses 4–6, 9–10) / тактический (Annex A, SoA) / операционный (Clause 8).","sec":"это базовая операционная система CISO. Annex A годится как единый словарь контролей для сопоставления NIS2, DORA, GDPR Art. 32 и TOMs. Контроли для агентов нужно дописывать отдельно: Annex A о них ничего не знает. Роль: владелец.","biz":"сертификат 27001: частое условие закупок B2B, особенно в ЕС. Привлекать безопасность при изменении scope, новых поставщиках облака (A.5.23) и разработке (A.8.28).","lim":"Сертификат подтверждает систему управления, а не уровень защищённости. Annex A не содержит контролей для ИИ и агентов: prompt injection, автономность, делегирование. Текст стандарта платный. Типичные ошибки: узкий scope ради сертификата, когда критичные системы остаются вне его; SoA как копия Annex A без обоснования","tbd":[{"w":"Пересмотр ISO/IEC 27001:2022","s":"не объявлен","c":"2027-06"}],"src":[{"n":"ISO/IEC 27001:2022","u":"https://www.iso.org/standard/27001"}],"rel":["GOV-03","GOV-05","REG-02","REG-03","REG-04","ZTA-01","ZTA-02","THR-08"],"lab":"ISO/IEC 27001"},{"id":"GOV-07","type":"card","domain":"GOV","short":"CSA AI Controls Matrix (AICM)","title":"CSA AICM (Cloud Security Alliance AI Controls Matrix)","status":"Актуально","next":"2027-03","kind":"ИБ / гибрид (каталог контролей, assurance, модель разделения ответственности)","core":"вендор-нейтральный каталог контролей для облачных и GenAI-систем. Главное отличие от ISO-стандартов: модель разделения ответственности. Для каждого контроля указано, кто из пяти участников цепочки поставки ИИ его реализует. Для оценки есть опросник AI-CAIQ. Матрица служит базой программы сертификации STAR for AI.","jtbd":"«Когда ИИ-система собрана из облака, чужой модели, платформы оркестрации и своего приложения, я хочу понять, какие контроли мои, а какие: поставщика, и проверить поставщиков по единому опроснику, чтобы закрыть пробелы между зонами ответственности».","level":"тактический (каталог контролей, разделение ответственности) / операционный (AI-CAIQ, доказательства).","sec":"главная ценность: закрыть зазоры ответственности: отвечает поставщик модели или мы? Использовать в TPRM и как опросник для ИИ-поставщиков. Роль: владелец. Право veto: не подключать ИИ-поставщика без заполненного AI-CAIQ.","biz":"привлекать безопасность при выборе модели и платформы. Для вендоров ИИ-продуктов публикация в реестре STAR снижает число опросов от клиентов.","lim":"Это не стандарт ISO, юридической силы нет. Матрица большая, и в основном это унаследованные облачные контроли. Число контролей отличается в зависимости от версии: 243 в v1.0 и 247 в v1.1. Встречаются оба варианта. Агентная специфика в базовой матрице слабая, поэтому выпущен Agent 3SRM.","tbd":[{"w":"Следующая версия AICM после v1.1 (июнь 2026) и развитие STAR for AI","s":"срок не объявлен","c":"2027-03"}],"src":[{"n":"CSA: AI Controls Matrix v1.1","u":"https://cloudsecurityalliance.org/artifacts/ai-controls-matrix-v1-1"},{"n":"CSA: Introducing the AICM","u":"https://cloudsecurityalliance.org/blog/2025/07/10/introducing-the-csa-ai-controls-matrix-a-comprehensive-framework-for-trustworthy-ai"},{"n":"CSA: Agent 3SRM","u":"https://cloudsecurityalliance.org/artifacts/agent-shared-security-and-safety-responsibility-model-agent-3srm"}],"rel":["GOV-01","GOV-03","GOV-06","REG-01","REG-04","THR-04","ASR-01"],"lab":"CSA AICM"},{"id":"REG-01","type":"card","domain":"REG","short":"EU AI Act","title":"EU AI Act (Regulation (EU) 2024/1689, Artificial Intelligence Act)","status":"Под наблюдением","next":"2026-12","kind":"гибрид (регуляторный: governance, комплаенс, ИБ)","core":"обязательный регламент ЕС, построенный на оценке риска. Он делит ИИ на 4 уровня: unacceptable (запрещён), high, transparency/limited, minimal. Для GPAI-моделей есть отдельные обязательства.","jtbd":"«Когда компания разрабатывает, поставляет или использует ИИ на рынке ЕС, я хочу определить класс риска каждой системы и свою роль, чтобы выполнить обязательства к сроку и избежать штрафов».","level":"стратегический (комплаенс, риск совета) / тактический (требования к системам).","sec":"владеть требованиями Art. 15 (точность, робастность, кибербезопасность) для high-risk систем. Обеспечить логирование и трассируемость, red teaming (TST-01), безопасность цепочки поставок. Роль: исполнитель и совладелец. Veto: через процесс conformity assessment.","biz":"классификация должна проходить на этапе дизайна продукта или закупки, иначе придётся переделывать архитектуру. Безопасность нужна для Art. 15 и логирования. Для вендоров соответствие: условие выхода на рынок ЕС.","lim":"Omnibus сдвинул только high-risk обязательства. Запреты, GPAI, прозрачность и полномочия органов действуют по прежним срокам. Ошибка: считать, что «AI Act отложен целиком». Агентов регламент отдельно не выделяет. Квалификация агентной системы зависит от сферы применения. Гармонизированные стандарты ещё в разработке: нет данных.","tbd":[{"w":"Окончание переходного срока по ст. 50(2)","s":"2026-12-02","c":"2026-12"},{"w":"Соответствие GPAI-моделей, выпущенных до 02.08.2025","s":"2027-08-02","c":"2027-07"},{"w":"High-risk по Annex III","s":"2027-12-02","c":"2027-06"},{"w":"High-risk по Annex I, полное применение","s":"2028-08-02","c":"2028-02"},{"w":"Остальные гармонизированные стандарты и руководства Комиссии","s":"по мере публикации","c":"2027-01"}],"src":[{"n":"EC: Enforcement of the AI Act","u":"https://digital-strategy.ec.europa.eu/en/policies/enforcement-ai-act"},{"n":"Regulation (EU) 2024/1689 (EUR-Lex)","u":"https://eur-lex.europa.eu/eli/reg/2024/1689/oj"}],"rel":["GOV-01","GOV-03","GOV-04","REG-02","REG-03","REG-04","ZTA-01","THR-01","THR-02","TST-01"],"lab":"EU AI Act"},{"id":"REG-02","type":"card","domain":"REG","short":"GDPR в части безопасности и ИИ","title":"GDPR (Regulation (EU) 2016/679, General Data Protection Regulation), в части безопасности и ИИ","status":"Под наблюдением","next":"2027-01","kind":"гибрид (регуляторный: приватность, ИБ, governance данных)","core":"для CISO здесь важны четыре точки: обязанность обеспечить безопасность, соразмерную риску (Art. 32); уведомление об утечке в течение 72 часов (Art. 33/34); DPIA для обработки с высоким риском (Art. 35); правовое основание обработки персональных данных при обучении и работе ИИ (Art. 6(1)(f) в трактовке Opinion 28/2024).","jtbd":"«Когда ИИ-система или агент обрабатывает персональные данные, я хочу обосновать правомерность обработки, обеспечить соразмерную защиту и уметь уведомить об утечке за 72 часа, чтобы не нарушить права субъектов и не получить санкции».","level":"стратегический (правовое основание, DPIA) / тактический (TOMs) / операционный (утечки).","sec":"CISO владеет Art. 32 и обнаружением утечек. Без обнаружения нет уведомления в 72 часа. Нужно встроиться в DPIA для каждой ИИ-системы. Роль: совладелец с DPO. Veto на запуск без DPIA и TOMs.","biz":"проходить DPIA и LIA до обучения или запуска ИИ, а не после. Для B2B SaaS это ещё и DPA с клиентами (Art. 28).","lim":"GDPR технологически нейтрален, для ИИ нужны толкования EDPB. Поправки Digital Omnibus к GDPR: пока предложение, IAPP критикует их как неудачные. Типичные ошибки: считать модель анонимной по умолчанию; отсчитывать 72 часа от завершения расследования, а не от осведомлённости; не вести журнал неуведомляемых утечек; делать DPIA формально.","tbd":[{"w":"Digital Omnibus в части GDPR (ст. 88c, ст. 9(2)(k)): статус принятия","s":"в процессе","c":"2027-01"},{"w":"Надзорный орган в Финляндии для ИИ-кейсов","s":"уточнить","c":"2027-01"}],"src":[{"n":"EDPB Opinion 28/2024 (PDF)","u":"https://www.edpb.europa.eu/system/files/2024-12/edpb_opinion_202428_ai-models_en.pdf"},{"n":"EDPB Guidelines 9/2022 (PDF)","u":"https://www.edpb.europa.eu/system/files/2023-04/edpb_guidelines_202209_personal_data_breach_notification_v2.0_en.pdf"},{"n":"Regulation (EU) 2016/679 (EUR-Lex)","u":"https://eur-lex.europa.eu/eli/reg/2016/679/oj"}],"rel":["GOV-03","GOV-04","REG-01","REG-03","REG-04","ZTA-01","THR-06"],"lab":"GDPR"},{"id":"REG-03","type":"card","domain":"REG","short":"NIS2","title":"NIS2 (Directive (EU) 2022/2555, Network and Information Security Directive 2)","status":"Под наблюдением","next":"2027-01","kind":"гибрид (регуляторный: ИБ и governance)","core":"обязательный для essential и important entities (Annex I и II) минимум мер управления киберрисками. Мер десять, они перечислены в Art. 21(2). Добавляются поэтапная отчётность об инцидентах (Art. 23) и личная ответственность руководства (Art. 20).","jtbd":"«Когда компания попадает в сектор NIS2 или поставляет таким компаниям, я хочу выстроить подтверждаемый минимум мер и процесс отчётности, чтобы пройти надзор, уложиться в сроки уведомлений и защитить руководство от личной ответственности».","level":"стратегический (Art. 20, ответственность совета) / тактический (Art. 21) / операционный (Art. 23).","sec":"CISO владеет мерами и отчётностью. Он готовит пакет для management body: риски, меры, остаточный риск. Совету отводится роль утверждающего и контролирующего. CISO: исполнитель с правом эскалации.","biz":"привлекать безопасность при оценке статуса, выходе в новый сектор или страну ЕС и выборе поставщиков. Для B2B-вендоров соответствие NIS2 становится вопросом в закупках клиентов.","lim":"Это директива, поэтому детали отличаются по странам: Art. 21(2) задаёт минимум, страна может добавить требования. Финляндия распределила надзор между семью органами, и важно не ошибиться с надзорным органом. Типичные ошибки: считать, что «NIS2 не про нас», если компания – поставщик essential entity","tbd":[{"w":"Транспозиция NIS2 во Франции, Ирландии, Испании","s":"просрочена","c":"2027-01"},{"w":"Пересмотр NIS2 Комиссией","s":"по графику директивы","c":"2027-06"}],"src":[{"n":"Directive (EU) 2022/2555 (EUR-Lex)","u":"https://eur-lex.europa.eu/eli/dir/2022/2555/oj"}],"rel":["GOV-03","GOV-06","REG-01","REG-04","ZTA-01","ZTA-02","ZTA-03","ZTA-05"],"lab":"NIS2"},{"id":"REG-04","type":"card","domain":"REG","short":"DORA","title":"DORA (Regulation (EU) 2022/2554, Digital Operational Resilience Act)","status":"Актуально","next":"2027-01","kind":"гибрид (регуляторный: ИБ, операционная устойчивость, управление третьими сторонами)","core":"единые требования к цифровой операционной устойчивости финансового сектора. Они охватывают управление ICT-рисками, отчётность об инцидентах, тестирование устойчивости и риск ICT-поставщиков. Критичные ICT-поставщики находятся под прямым надзором ЕС.","jtbd":"«Когда финансовая организация зависит от ICT и сторонних провайдеров, я хочу выстроить подтверждаемую устойчивость, отчётность и контроль поставщиков по единым правилам ЕС, чтобы пройти надзор и пережить крупный ICT-сбой».","level":"стратегический (governance, концентрационный риск) / тактический / операционный (инциденты).","sec":"владеть классификацией и отчётностью, тестированием и требованиями безопасности в договорах ICT. Роль: владелец. Veto на подключение ICT-поставщика без договорных условий DORA.","biz":"у любого нового SaaS, облака, ИИ-провайдера для критичной функции должна быть DORA-экспертиза. Для вендоров финсектора соответствие DORA: условие продаж.","lim":"Смысл регламента во многом в RTS/ITS, и их тоже надо отслеживать. Сроки отчётности DORA жёстче, чем у NIS2: 4 часа против 24. Типичные ошибки: путать момент обнаружения с моментом классификации; не подавать intermediate report, если ничего не изменилось; не учитывать ИИ-провайдеров как ICT-поставщиков","tbd":[{"w":"Обновления RTS/ITS и списка CTPP ESAs","s":"ежегодно","c":"2026-12"},{"w":"Детали TLPT для агентных систем","s":"уточнить","c":"2027-03"}],"src":[{"n":"ESMA: назначение CTPP","u":"https://www.esma.europa.eu/press-news/esma-news/european-supervisory-authorities-designate-critical-ict-third-party-providers"},{"n":"EBA: JTS по отчётности об инцидентах","u":"https://www.eba.europa.eu/activities/single-rulebook/regulatory-activities/operational-resilience/joint-technical-standards-major-incident-reporting"},{"n":"Regulation (EU) 2022/2554 (EUR-Lex)","u":"https://eur-lex.europa.eu/eli/reg/2022/2554/oj"}],"rel":["GOV-03","GOV-06","GOV-07","REG-01","REG-03","ZTA-01","ZTA-02","ASR-02"],"lab":"DORA"},{"id":"ZTA-01","type":"card","domain":"ZTA","short":"Zero Trust для ИИ-агентов (Anthropic)","title":"Zero Trust для AI-агентов (Zero Trust for AI Agents, Anthropic)","status":"Актуально","next":"2027-05","kind":"ИБ.","core":"Три принципа Zero Trust (never trust/always verify, assume breach, least privilege) применяются к агентам, у которых есть автономия, инструменты, память и связи с другими агентами. Контроли разложены по трём уровням (Foundation / Enterprise / Advanced) и восьмифазному процессу внедрения.","jtbd":"«Когда компания выводит автономных агентов в прод, я хочу заранее задать для них проверяемую идентичность, минимальные права и контроль поведения, чтобы ущерб от компрометации был ограничен и прослеживался».","level":"тактический. Части I–II также служат стратегическим брифингом для CISO и совета.","sec":"запросить реестр агентов, их креды, список инструментов и MCP, логи с request ID. Участвовать в дизайне границ агента и в выборе целевого уровня. Право veto: на выпуск агента со статическими API-ключами или без песочницы при недоверенном вводе.","biz":"подключать безопасность до разработки агента, на фазе требований. Обязательно: если агент получает доступ на запись, работает с внешними данными или делегирует задачи другим агентам.","lim":"документ не даёт юридической или комплаенс-гарантии. Инструментарий ещё зреет, контроли Advanced со временем станут базовыми. Типичные ошибки: friction-контроли вместо жёстких барьеров, общий сервисный аккаунт на нескольких агентов, ротация статических ключей вместо короткоживущих токенов. Автор документа: вендор моделей, советы по Claude Code вендорские.","tbd":[{"w":"Обновление e-book (редакция 18.05.2026)","s":"не объявлено","c":"2027-05"},{"w":"Федеральный срок перехода США на Zero Trust","s":"2027","c":"2027-09"}],"src":[{"n":"Anthropic, Zero Trust for AI Agents (PDF)","u":"https://cdn.prod.website-files.com/6889473510b50328dbb70ae6/6a1611a04085d7cd3dadc924_Claude-eBook-Zero-Trust-for-AI-Agents-05182026.pdf"},{"n":"NIST SP 800-207","u":"https://csrc.nist.gov/pubs/sp/800/207/final"},{"n":"OWASP Top 10 for Agentic Applications 2026","u":"https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/"}],"rel":["ZTA-02","ZTA-03","ZTA-05","IAM-02","IAM-03","PRT-01","SCM-01","SCM-03","THR-01","DEF-01"],"lab":"Anthropic ZT for Agents"},{"id":"ZTA-02","type":"card","domain":"ZTA","short":"NIST SP 800-207 Zero Trust Architecture","title":"NIST SP 800-207 Zero Trust Architecture (вместе с SP 800-207A и SP 1800-35)","status":"Актуально","next":"2027-06","kind":"ИБ (референсная архитектура и принципы zero trust)","core":"доверие не выдаётся по местоположению в сети. Каждый запрос субъекта к ресурсу решается по динамической политике, сессия за сессией. Логические компоненты: Policy Engine (PE) принимает решение и записывает его в журнал; Policy Administrator (PA) открывает или закрывает путь связи по команде PE; Policy Enforcement Point (PEP) стоит на этом пути и исполняет решение. Плоскость управления (PE, PA, PEP) отделена логически и недоступна напрямую с корпоративных активов.","jtbd":"«Мне нужен общепринятый словарь и эталонная модель zero trust, чтобы проектировать доступ, в том числе для агентов, и говорить с вендорами, аудиторами и регуляторами на одном языке».","level":"стратегический (принципы) / тактический (логическая архитектура).","sec":"использовать как базовый словарь ZT: на него опираются ZTA-01, ZTA-06, IAM-01, ZTA-04. Главный вывод для агентов: решение о доступе принимает внешний PE, а не модель. Роль: владелец архитектуры.","biz":"800-207 упоминается в федеральных требованиях США и в материалах вендоров. При выборе SSE, ZTNA или шлюзов агентов стоит спрашивать, где у решения PE и PEP и как оно отзывает сессию.","lim":"Документ 2020 года не описывает агентную специфику: prompt injection, злоупотребление легитимными правами, делегирование. Злоупотребление правами внутри разрешённого доступа ZT сам по себе не предотвращает, о чём прямо говорит книга. Это логическая модель, а не продукт. Типичные ошибки: считать ZTNA-продукт полной реализацией 800-207","tbd":[{"w":"Пересмотр SP 800-207 с учётом агентов","s":"не объявлен","c":"2027-06"}],"src":[{"n":"NIST SP 800-207 (PDF)","u":"https://nvlpubs.nist.gov/nistpubs/specialpublications/NIST.SP.800-207.pdf"},{"n":"NIST SP 800-207A","u":"https://csrc.nist.gov/pubs/sp/800/207/a/final"},{"n":"NIST SP 1800-35","u":"https://csrc.nist.gov/pubs/sp/1800/35/final"},{"n":"NIST: 19 ways to build ZTA","u":"https://www.nist.gov/news-events/news/2025/06/nist-offers-19-ways-build-zero-trust-architectures"}],"rel":["ZTA-01","ZTA-03","ZTA-04","ZTA-05","ZTA-06","IAM-01","IAM-02","IAM-03"],"lab":"NIST SP 800-207"},{"id":"ZTA-03","type":"card","domain":"ZTA","short":"CISA Zero Trust Maturity Model v2.0","title":"CISA Zero Trust Maturity Model v2.0 (ZTMM)","status":"Актуально","next":"2027-03","kind":"ИБ (модель зрелости и самооценки zero trust)","core":"zero trust разложен на 5 столпов и 3 сквозные возможности. Каждый столп оценивается по 4 стадиям зрелости. Стадии ставятся по каждому столпу и каждой функции отдельно, а не одной оценкой на всю организацию. Модель описывает результат, а не набор activities. В этом её отличие от DoD (ZTA-04).","jtbd":"«Когда нужно честно ответить, насколько мы зрелы в zero trust и куда двигаться дальше, я хочу простую шкалу по столпам. Тогда я покажу совету текущее и целевое состояние и выберу приоритеты без детализации на 152 activities».","level":"стратегический (оценка, дорожная карта) / тактический (функции по столпам).","sec":"использовать как простой язык зрелости для совета и аудита и как каркас ежегодной оценки. Обязательно оценивать агентов отдельно от людей. Роль: владелец оценки.","biz":"для федеральных поставщиков США модель фактически обязательна. Для ЕС это рекомендательный эталон, его удобно сочетать с NIS2 (REG-03).","lim":"Версия 2023 года, агентной специфики в ней нет. Нет формальной методики оценки: стадии описаны качественно, так что оценка субъективна. Версия 3.0 не выпущена (контроль в блоке актуальности). Типичные ошибки: одна общая оценка вместо оценок по столпам; забыть про NHI; стремиться к Optimal везде; путать 5 столпов ZTMM с 7 столпами DoD.","tbd":[{"w":"CISA ZTMM v3.0","s":"не объявлен","c":"2027-03"}],"src":[{"n":"CISA: Zero Trust Maturity Model","u":"https://www.cisa.gov/zero-trust-maturity-model"},{"n":"CISA ZTMM v2.0 (PDF)","u":"https://www.cisa.gov/sites/default/files/2023-04/CISA_Zero_Trust_Maturity_Model_Version_2_508c.pdf"},{"n":"OMB M-22-09 (PDF)","u":"https://www.whitehouse.gov/wp-content/uploads/2022/01/M-22-09.pdf"},{"n":"Microsoft: соответствие сервисов ZTMM","u":"https://learn.microsoft.com/en-us/security/zero-trust/cisa-zero-trust-maturity-model-intro"}],"rel":["REG-03","ZTA-01","ZTA-02","ZTA-04","ZTA-05","IAM-01"],"lab":"CISA ZTMM"},{"id":"ZTA-04","type":"card","domain":"ZTA","short":"DoD/DoW Zero Trust Reference Architecture","title":"DoD Zero Trust Reference Architecture v2.0 (вместе со Strategy и Capability Execution Roadmap)","status":"Под наблюдением","next":"2026-12","kind":"ИБ (референсная архитектура zero trust и программа внедрения)","core":"zero trust разложен на 7 столпов, 45 capabilities и 152 activities. У каждой activity определены результаты. Есть два уровня: Target (91 activity, минимум для всех компонентов к концу FY2027) и Advanced (все 152). Data: центральный столп: остальные существуют, чтобы его защищать.","jtbd":"«Когда нужно перейти от лозунга \"zero trust\" к измеримой программе, я хочу иметь декомпозицию до конкретных activities с уровнями зрелости и сроками, чтобы планировать внедрение, отчитываться о прогрессе и не пропустить ни один столп».","level":"стратегический (Strategy, уровни) / тактический (RA, capabilities) / операционный (activities).","sec":"использовать как самую детальную публичную декомпозицию zero trust для планирования и отчётов совету. Агентов явно включить в NPE. Роль: владелец программы.","biz":"для подрядчиков DoD программа обязательна. Остальным она служит эталоном, на который ссылаются вендоры и аудиторы. Безопасность стоит привлекать при выборе платформ IAM, сети и данных.","lim":"Архитектура рассчитана на масштаб и бюджет DoD и избыточна для малых организаций. Агентная специфика (автономия, делегирование, prompt injection) явно не описана, только NPE в общем виде. RA v2.0: документ 2022 года. Strategy 2.0 может изменить содержание. Типичные ошибки: пройти чек-лист из 152 пунктов, не опираясь на столп Data","tbd":[{"w":"DoW Zero Trust Strategy 2.0 (OT, IoT, системы вооружений): факт публикации","s":"обещана на начало 2026","c":"2026-12"},{"w":"Target-уровень для всех компонентов","s":"2027-09-30 (конец FY2027)","c":"2027-10"},{"w":"Advanced-уровень","s":"FY2032","c":"2031-10"}],"src":[{"n":"DoD ZT Reference Architecture v2.0 (PDF)","u":"https://dodcio.defense.gov/Portals/0/Documents/Library/(U"},{"n":"DoD Zero Trust Strategy (PDF)","u":"https://dodcio.defense.gov/Portals/0/Documents/Library/DoD-ZTStrategy.pdf"},{"n":"Capability Execution Roadmap (PDF)","u":"https://dodcio.defense.gov/Portals/0/Documents/Library/ZT-ExecutionRoadmap-v1.1.pdf"},{"n":"Microsoft: настройка облаков под DoD ZT","u":"https://learn.microsoft.com/en-us/security/zero-trust/dod-zero-trust-strategy-intro"}],"rel":["GOV-06","ZTA-01","ZTA-02","ZTA-03","ZTA-05","ZTA-06","IAM-01"],"lab":"DoD ZT RA"},{"id":"ZTA-05","type":"card","domain":"ZTA","short":"NSA Zero Trust Implementation Guidelines","title":"NSA Zero Trust Implementation Guidelines (ZIGs)","status":"Под наблюдением","next":"2027-01","kind":"ИБ (пошаговые руководства по внедрению zero trust)","core":"ZIGs превращают 91 Target-level activity из DoW ZT Framework в последовательный план с требованиями, предшественниками и последователями каждой activity. Все 152 activities разложены на пять фаз. Текущие ZIGs покрывают первые три: Discovery, Phase One, Phase Two. Руководства модульные: можно взять только нужные возможности под свою зрелость.","jtbd":"«Я знаю столпы и activities (ZTA-04), но не понимаю, с чего начать и в каком порядке. Мне нужен план с зависимостями, чтобы строить zero trust без тупиков и переделок».","level":"операционный / тактический.","sec":"использовать как готовый план проекта ZT с зависимостями. Это самая практичная часть американской «тройки» ZT. Роль: руководитель программы.","biz":"для подрядчиков DoW это фактически рабочий стандарт. Остальным ZIGs помогают планировать бюджет: Phase One обязательна, Phase Two идёт по мере возможностей.","lim":"Покрыт только уровень Target, Advanced (фазы 3–4) пока не описан. Руководства привязаны к терминологии и структуре DoW. Агентная специфика явно не выделена, только NPE. Документы большие, нужна команда опытных практиков. Типичные ошибки: пропустить Discovery; внедрять activities без учёта предшественников; не включить агентов в инвентаризацию NPE.","tbd":[{"w":"ZIG Phase Three и Phase Four (Advanced)","s":"срок не объявлен","c":"2027-01"}],"src":[{"n":"NSA: ZIG hub","u":"https://www.nsa.gov/Cybersecurity/ZIG/"},{"n":"ZIG Primer (PDF)","u":"https://media.defense.gov/2026/Jan/08/2003852320/-1/-1/0/CTR_ZERO_TRUST_IMPLEMENTATION_GUIDELINE_PRIMER.PDF"},{"n":"ZIG Discovery (PDF)","u":"https://media.defense.gov/2026/Jan/08/2003852321/-1/-1/0/CTR_ZIG_DISCOVERY_PHASE.PDF"},{"n":"ZIG Phase One (PDF)","u":"https://media.defense.gov/2026/Jan/30/2003868308/-1/-1/0/CTR_ZIG_PHASE_ONE.PDF"}],"rel":["ZTA-01","ZTA-02","ZTA-03","ZTA-04","IAM-01"],"lab":"NSA ZIGs"},{"id":"ZTA-06","type":"card","domain":"ZTA","short":"AAGATE (CSA)","title":"AAGATE (Agentic AI Governance Assurance & Trust Engine)","status":"Актуально","next":"2027-03","kind":"ИБ / гибрид (референсная архитектура runtime-governance для агентов)","core":"управляющий слой (control plane) в Kubernetes, через который проходят все действия агентов. Он работает в zero-trust service mesh и включает объяснимый policy engine, поведенческую аналитику и механизмы децентрализованной подотчётности. Каждой функции AI RMF соответствует свой фреймворк: MAP – MAESTRO, MEASURE – гибрид OWASP AIVSS и SEI SSVC, MANAGE – CSA Agentic AI Red Teaming Guide.","jtbd":"«Компания приняла NIST AI RMF на бумаге, а агенты работают с машинной скоростью. Мне нужен механизм, который применяет политики в рантайме, непрерывно меряет риск и умеет мгновенно остановить агента. Тогда governance перестанет быть ежегодным документом».","level":"операционный / тактический (архитектура).","sec":"это эталонная архитектура для принудительного применения zero trust к агентам в рантайме. Подходит для оценки зрелости своей платформы. Роль: архитектурный владелец. Veto: не выпускать агентов в production без mesh и kill switch.","biz":"привлекать безопасность при выборе платформы агентов. Если Kubernetes не используется, принципы переносятся, а реализация: нет.","lim":"Это теоретическая архитектура, а не проверенная в production система. Она привязана к стеку Kubernetes, Istio и Cilium. Компонентов много, и сложность эксплуатации высока. Часть механизмов (soulbound-токены, DID) пока экспериментальная. Типичные ошибки: внедрить mesh без политик и UEBA, получив zero trust сетевого уровня без поведенческого контроля","tbd":[{"w":"Независимые оценки эффективности и продуктовые реализации","s":"нет данных","c":"2027-03"}],"src":[{"n":"arXiv 2510.25863","u":"https://arxiv.org/html/2510.25863v1"},{"n":"CSA blog: AAGATE","u":"https://cloudsecurityalliance.org/blog/2025/12/22/aagate-a-nist-ai-rmf-aligned-governance-platform-for-agentic-ai"},{"n":"CSA Labs: NIST AI RMF Agentic Profile","u":"https://labs.cloudsecurityalliance.org/agentic/agentic-nist-ai-rmf-profile-v1/"}],"rel":["GOV-01","GOV-02","GOV-07","ZTA-01","IAM-01","IAM-02","SCM-02","THR-04","TST-01"],"lab":"CSA AAGATE"},{"id":"IAM-01","type":"card","domain":"IAM","short":"NIST CAISI AI Agent Standards Initiative","title":"NIST CAISI AI Agent Standards Initiative","status":"Под наблюдением","next":"2026-12","kind":"гибрид (государственная программа стандартизации: ИБ, идентичность, совместимость агентов)","core":"это пока программа, а не стандарт. Она стоит на трёх опорах: стандарты, которые разрабатывает индустрия, и лидерство США в международных органах; открытые протоколы агентов, которые развивает сообщество; исследования безопасности и идентичности агентов. Для CISO главное сейчас: концепт NCCoE: агент должен получить собственную идентичность, а не жить под общей сервисной учётной записью.","jtbd":"«Агенты в компании работают под общими сервисными учётками без отдельной идентичности, авторизации и подотчётности. Я хочу опереться на формирующийся подход NIST к идентичности и авторизации агентов, чтобы мои контроли совпали с будущими федеральными и индустриальными стандартами».","level":"стратегический (направление стандартизации) / тактический (модель IAM для агентов).","sec":"использовать концепт NCCoE как ориентир для IAM агентов. Отслеживать результаты инициативы, потому что от них будут зависеть требования к закупкам и аудиту. Роль: владелец IAM-модели агентов. Право veto: агент не выходит в production без собственной идентичности.","biz":"если в компании агенты нескольких вендоров, нужно оценить риски их совместимости и распространить governance на все платформы.","lim":"У будущих руководств пока нет номеров и сроков публикации. Концепт NCCoE: это демонстрационный проект, а не финальный документ. Инициатива американская: для ЕС она носит рекомендательный характер. Типичные ошибки: считать инициативу готовым стандартом; дать агенту идентичность пользователя вместо отдельной","tbd":[{"w":"Итоговые руководства NCCoE по идентичности и авторизации агентов","s":"номера и сроки не объявлены","c":"2027-01"},{"w":"NIST AI Agent Interoperability Profile","s":"IV кв. 2026 (план)","c":"2026-12"}],"src":[{"n":"NIST: AI Agent Standards Initiative","u":"https://www.nist.gov/artificial-intelligence/ai-agent-standards-initiative"},{"n":"NIST: анонс инициативы","u":"https://www.nist.gov/news-events/news/2026/02/announcing-ai-agent-standards-initiative-interoperable-and-secure"},{"n":"NCCoE: концепт идентичности и авторизации агентов (PDF)","u":"https://www.nccoe.nist.gov/sites/default/files/2026-02/accelerating-the-adoption-of-software-and-ai-agent-identity-and-authorization-concept-paper.pdf"},{"n":"Federal Register: RFI","u":"https://www.federalregister.gov/documents/2026/01/08/2026-00206/request-for-information-regarding-security-considerations-for-artificial-intelligence-agents"}],"rel":["GOV-01","GOV-02","REG-04","ZTA-01","ZTA-02","ZTA-06","IAM-02","IAM-03","PRT-01","THR-03","THR-05"],"lab":"NIST CAISI"},{"id":"IAM-02","type":"card","domain":"IAM","short":"SPIFFE/SPIRE","title":"SPIFFE/SPIRE (Secure Production Identity Framework for Everyone / SPIFFE Runtime Environment)","status":"Под наблюдением","next":"2027-03","kind":"ИБ (идентичность workloads и NHI; открытый стандарт и его эталонная реализация)","core":"workload получает криптографически проверяемую идентичность по своему происхождению и среде исполнения. Секрет вручную не выдаётся. Основные элементы: SPIFFE ID: URI внутри trust domain; SVID: короткоживущий подписанный документ, который ротируется автоматически. SVID бывает двух форматов: X.509-SVID: сертификат со SPIFFE ID в SAN URI, используется для mTLS; JWT-SVID: JWT со SPIFFE ID в sub, используется там, где mTLS недоступен.","jtbd":"«Агенты ходят в базы, API и MCP со статическими ключами, которые можно найти grep'ом в lockfile. Я хочу, чтобы каждый экземпляр агента получал криптографическую идентичность при запуске на основе аттестации и чтобы она жила минуты или часы. Тогда кража секрета теряет смысл, и все действия можно атрибутировать».","level":"операционный / тактический (инфраструктура идентичности).","sec":"это базовый строительный блок идентичности агентов. Он закрывает уровни Foundation и Enterprise из книги и Identity в ZTMM (ZTA-03). Роль: владелец архитектуры идентичности. Право veto: не выпускать агента в production со статическими секретами.","biz":"SPIFFE уже встроен в облачные платформы агентов, например Google ACE, и в решения вендоров идентичности, например Palo Alto Idira. При выборе платформы агентов стоит спрашивать, совместима ли она со SPIFFE.","lim":"SPIFFE идентифицирует workload, но ничего не говорит о намерениях агента и не защищает от prompt injection внутри легитимной идентичности. SPIRE Server становится критичным компонентом, нужна высокая доступность. Стандарты для агентов (WIMSE AIMS) пока в статусе черновиков.","tbd":[{"w":"IETF WIMSE: draft-ietf-wimse-aims (принят в работу 09.2026)","s":"черновик","c":"2027-03"}],"src":[{"n":"SPIFFE: SPIRE Concepts","u":"https://spiffe.io/docs/latest/spire-about/spire-concepts/"},{"n":"CNCF TAG Security: self-assessment","u":"https://tag-security.cncf.io/community/assessments/projects/spiffe-spire/self-assessment/"},{"n":"IETF WIMSE","u":"https://datatracker.ietf.org/group/wimse/"},{"n":"CSA Labs: IETF и стандарты идентичности агентов","u":"https://labs.cloudsecurityalliance.org/research/csa-research-note-ietf-agent-identity-standards-20260902-csa/"}],"rel":["ZTA-01","ZTA-02","ZTA-03","ZTA-04","ZTA-05","ZTA-06","IAM-01","IAM-03"],"lab":"SPIFFE/SPIRE"},{"id":"IAM-03","type":"card","domain":"IAM","short":"OAuth 2.0 / OIDC для агентов","title":"OAuth 2.0 / OIDC для агентов (Token Exchange RFC 8693, On-Behalf-Of, MCP OAuth 2.1)","status":"Под наблюдением","next":"2027-03","kind":"ИБ (стандарты авторизации и делегирования доступа)","core":"SPIFFE (IAM-02) отвечает на вопрос «какой это workload». OAuth отвечает на вопрос «от чьего имени и с какими правами он действует». Главный механизм: делегирование, а не подмена личности. Агент A сохраняет собственную идентичность, отдельную от пользователя B, и любые его действия явно выполняются как «A от имени B». В токене пользователь остаётся в sub, агент записывается в act.sub.","jtbd":"«Когда агент вызывает API и другие агенты от имени сотрудника, мне нужно, чтобы каждый токен был узким по scope и audience, жил минуты и хранил цепочку \"кто, от чьего имени\". Тогда кража токена почти бесполезна, confused deputy невозможен, а аудит восстанавливает цепочку делегирования».","level":"операционный / тактический (протоколы IAM).","sec":"OAuth здесь: основной механизм least agency на уровне доступа к API. Он закрывает confused deputy и unscoped privilege inheritance, а также Non-repudiation в STRIDE (THR-05). Роль: владелец IAM-модели. Veto: без проверки audience и без act в production не выпускать.","biz":"у Microsoft, Auth0 и других крупных IdP уже есть готовые реализации OBO и token exchange. При выборе IdP стоит спросить, поддерживает ли он RFC 8693, вложенные act и may_act.","lim":"OAuth не защищает от prompt injection, если агент действует внутри легитимного scope. Многошаговое делегирование и отзыв по цепочке в IETF ещё не решены. Поддержка act и may_act у IdP неполная. Bearer-токен без привязки можно украсть, если его не связать с ключом через DPoP или mTLS.","tbd":[{"w":"IETF: многошаговое делегирование и отзыв по цепочке (WIMSE AIMS)","s":"черновик","c":"2027-03"},{"w":"Поддержка act/may_act у крупных IdP","s":"по релизам вендоров","c":"2027-03"}],"src":[{"n":"RFC 8693: OAuth 2.0 Token Exchange","u":"https://www.rfc-editor.org/info/rfc8693/"},{"n":"MCP Authorization 2025-11-25","u":"https://modelcontextprotocol.io/specification/2025-11-25/basic/authorization"}],"rel":["ZTA-01","ZTA-02","IAM-01","IAM-02","PRT-01","PRT-02","THR-05"],"lab":"OAuth/OIDC"},{"id":"PRT-01","type":"card","domain":"PRT","short":"MCP Security","title":"MCP Security (OWASP MCP Security Cheat Sheet + официальные MCP Security Best Practices)","status":"Под наблюдением","next":"2027-01","kind":"ИБ (угрозы и защитные практики протокола подключения агентов к инструментам)","core":"в обычном API каждый вызов контролирует разработчик. В MCP модель сама решает, какой инструмент вызвать, когда и с какими параметрами. Отсюда сочетание prompt injection, атак на цепочку поставок и confused deputy. Модель видит в контексте описания инструментов всех подключённых серверов сразу, и на этом построены межсерверные атаки.","jtbd":"«Когда команды подключают к агентам десятки MCP-серверов, мне нужен понятный перечень угроз и обязательных контролей. Тогда отравленный инструмент, подмена после одобрения или кража токена не превратят агента в канал эксфильтрации».","level":"операционный / тактический.","sec":"использовать как чек-лист допуска MCP-серверов (gate перед production) и как основу правил MCP-шлюза. Роль: владелец политики подключения инструментов, с правом veto на серверы без pinning и с широкими scopes.","biz":"вести реестр одобренных MCP-серверов вместо самостоятельной установки разработчиками. Ни веб-контент, ни недоверенные данные не должны запускать установку сервера.","lim":"Хеширование ловит изменения метаданных, но не изменения кода или поведения сервера за неизменным определением. Annotations: подсказки, а не механизм принуждения. Фильтры инструкций обходятся кодированием и мультиязычностью, поэтому годятся только как дополнительный слой. Типичные ошибки: auto-approve; общие токены на несколько серверов","tbd":[{"w":"Следующая ревизия спецификации MCP и Security Best Practices (после 2026-07-28)","s":"несколько раз в год","c":"2027-01"}],"src":[{"n":"OWASP MCP Security Cheat Sheet","u":"https://cheatsheetseries.owasp.org/cheatsheets/MCP_Security_Cheat_Sheet.html"},{"n":"MCP Security Best Practices (2026-07-28)","u":"https://modelcontextprotocol.io/docs/2026-07-28/tutorials/security/security_best_practices"},{"n":"MCP Authorization 2025-11-25","u":"https://modelcontextprotocol.io/specification/2025-11-25/basic/authorization"}],"rel":["ZTA-01","ZTA-06","IAM-02","IAM-03","PRT-02","SCM-01","THR-01","THR-05"],"lab":"MCP Security"},{"id":"PRT-02","type":"card","domain":"PRT","short":"A2A (Agent2Agent)","title":"A2A (Agent2Agent Protocol): безопасность межагентного взаимодействия, ACP включён в A2A","status":"Под наблюдением","next":"2026-12","kind":"ИБ (угрозы и защита протокола «агент ↔ агент»)","core":"MCP соединяет агента с инструментом (PRT-01), а A2A соединяет агентов между собой. Агент публикует Agent Card по адресу /.well-known/agent-card.json. В карточке указаны имя, версия, интерфейсы, skills с описаниями и примерами, а также securitySchemes. Поддерживаемые схемы: API key, OAuth 2.0, OIDC, mTLS. Учётные данные передаются только в HTTP-заголовках, а не в JSON-RPC payload. Подпись карточки (AgentCardSignature): это JWS (RFC 7515) поверх канонизированной JCS-версии (RFC 8785).","jtbd":"«Мой оркестратор делегирует задачи чужим агентам: партнёрам, вендорам, другим командам. Мне нужно убедиться, что агент тот, за кого себя выдаёт, что его карточка не отравлена, а делегированный доступ узкий и прослеживается. Тогда компрометация одного участника не перехватит всю цепочку».","level":"операционный / тактический.","sec":"использовать как gate для подключения внешних агентов и основу правил A2A-прокси. Роль: владелец политики межагентного доверия. Право veto: на неподписанные карточки и делегирование без сужения scope.","biz":"с переходом в AAIF A2A не зависит от одного вендора. В договорах с партнёрами, чьи агенты подключаются к вашим, стоит требовать подписанные карточки, mTLS и журналы задач. Новых проектов на ACP не начинать, BeeAI уже мигрировал на A2A.","lim":"Подпись карточки необязательна, и оркестраторы на практике часто её не проверяют. Подпись подтверждает только личность, не права. Многошаговое делегирование и отзыв по цепочке в стандартах пока не решены. Протокол безопасен ровно настолько, насколько безопасна его реализация на клиентах и серверах.","tbd":[{"w":"A2A v1.2: подтверждение релиза","s":"заявлено, не подтверждено","c":"2026-12"},{"w":"Обязательность подписи Agent Card (сейчас SHOULD)","s":"не объявлено","c":"2027-03"}],"src":[{"n":"A2A: переход в Agentic AI Foundation","u":"https://a2a-protocol.org/latest/blog/2026/08/27/a-new-chapter-for-a2a-joining-the-agentic-ai-foundation/"},{"n":"LF AI & Data: ACP объединяется с A2A","u":"https://lfaidata.foundation/communityblog/2025/08/29/acp-joins-forces-with-a2a-under-the-linux-foundations-lf-ai-data/"},{"n":"IEEE: Agent Card Poisoning","u":"https://ieeexplore.ieee.org/abstract/document/11588515"}],"rel":["ZTA-01","ZTA-06","IAM-02","IAM-03","PRT-01","THR-01"],"lab":"A2A"},{"id":"SCM-01","type":"card","domain":"SCM","short":"AIBOM / CycloneDX ML-BOM / SPDX 3.0","title":"OWASP AIBOM / CycloneDX ML-BOM (вместе с SPDX 3.0 AI и Dataset profiles)","status":"Актуально","next":"2027-03","kind":"ИБ и governance (машиночитаемая инвентаризация компонентов ИИ и их происхождения)","core":"AIBOM: машиночитаемая инвентаризация компонентов ИИ: моделей, датасетов, инструментов агентов, guardrails и элементов среды исполнения. К каждому компоненту приложены доказательства происхождения, прав, целостности и результатов оценки. В CycloneDX модель описывается компонентом machine-learning-model с modelCard, в котором три блока: modelParameters: подход, задача, архитектура, датасеты, входы и выходы; quantitativeAnalysis: метрики","jtbd":"«В новой уязвимости модели, отравленном датасете или скомпрометированном MCP-сервере мне нужно за минуты найти, какие агенты и продукты затронуты. Ещё мне нужно показать аудитору и регулятору, откуда взяты модель и данные и на каких правах».","level":"операционный (инвентаризация) / тактический (supply chain и комплаенс).","sec":"AIBOM: основа быстрого реагирования на инциденты в supply chain ИИ и обязательный артефакт релиза агента. Роль: владелец реестра BOM, право veto на выпуск без AIBOM.","biz":"AIBOM упрощает комплаенс и закупки: прозрачность происхождения, прав и лицензий моделей и данных. Это удобный пункт для договоров с вендорами ИИ.","lim":"AIBOM: декларация. Без подписи и аттестации он не доказывает, что в проде работает именно описанная модель. Данные о датасетах у публичных моделей часто неполны. Агентные компоненты (промпты, MCP, память) в стандартах описаны слабее, чем модели. Типичные ошибки: разовая генерация вместо CI; пустые modelCard для галочки","tbd":[{"w":"Следующая версия CycloneDX и развитие OWASP AIBOM (полнота, агентные компоненты)","s":"не объявлено","c":"2027-03"}],"src":[{"n":"OWASP AIBOM Project","u":"https://owaspaibom.org/"},{"n":"OWASP AIBOM Generator","u":"https://genai.owasp.org/resource/owasp-aibom-generator/"},{"n":"CycloneDX: ML-BOM","u":"https://cyclonedx.org/capabilities/mlbom/"},{"n":"CycloneDX: Authoritative Guide to AI/ML-BOM (PDF)","u":"https://cyclonedx.org/guides/OWASP_CycloneDX-Authoritative-Guide-to-AI-ML-BOM-en.pdf"}],"rel":["GOV-07","REG-01","ZTA-01","ZTA-06","PRT-01","PRT-02","SCM-02","SCM-03"],"lab":"AIBOM / CycloneDX"},{"id":"SCM-02","type":"card","domain":"SCM","short":"SLSA","title":"SLSA (Supply-chain Levels for Software Artifacts)","status":"Актуально","next":"2027-05","kind":"ИБ (фреймворк целостности цепочки поставок ПО).","core":"provenance: подписанная запись о том, кто собрал артефакт, каким процессом и из каких входных данных. Чем выше уровень, тем труднее подделать сборку, provenance или сам артефакт.","jtbd":"«Мне нужно доказать, что образ агента, его MCP-серверы и модель собраны из проверенного кода на защищённой платформе и не подменены по дороге. Тогда отравленный артефакт не попадёт в прод даже при компрометации репозитория пакетов или учётной записи разработчика».","level":"операционный (CI/CD) / тактический (политики допуска).","sec":"обязательный gate «без L3-provenance в прод не идёт» для агентов, MCP-серверов и моделей. Роль: владелец политики допуска, с правом veto на неподписанные артефакты.","biz":"включать SLSA-уровень в требования к вендорам и в договоры. GitHub, GitLab и Google Cloud уже поддерживают генерацию provenance.","lim":"SLSA доказывает, как собран артефакт, но не что он безопасен: уязвимый код, собранный на L3, остаётся уязвимым. SLSA не защищает модель от отравления данных обучения. Provenance бесполезен без проверки при деплое. Типичные ошибки: остановиться на L1 и считать дело сделанным; подписывать, но не проверять; забыть про модели и MCP-серверы.","tbd":[{"w":"Следующая версия SLSA после v1.2 (ноябрь 2025)","s":"не объявлено","c":"2027-05"}],"src":[{"n":"SLSA v1.2 Specification","u":"https://slsa.dev/spec/v1.2/"},{"n":"SLSA v1.1: Security levels","u":"https://slsa.dev/spec/v1.1/levels"},{"n":"OpenSSF Model Signing","u":"https://openssf.org/projects/model-signing/"}],"rel":["GOV-07","ZTA-01","ZTA-06","IAM-02","PRT-01","SCM-01","SCM-03"],"lab":"SLSA"},{"id":"SCM-03","type":"card","domain":"SCM","short":"OpenSSF Scorecard","title":"OpenSSF Scorecard","status":"Актуально","next":"2027-03","kind":"ИБ. Автоматическая оценка практик безопасности open-source-репозиториев, то есть «здоровья» зависимостей.","core":"около 20 автоматических проверок, каждая с оценкой 0–10 и уровнем риска. Внутри проверки разбиты на пробы: отдельные эвристики с описанием мотивации, исходов и трудоёмкости исправления.","jtbd":"«Прежде чем подключить к агенту open-source MCP-сервер, SDK или фреймворк, я хочу за минуту понять, насколько безопасно он сопровождается. Тогда заброшенный проект или проект с опасным CI не станет точкой входа в мою цепочку поставок».","level":"операционный (CI-гейт, отбор зависимостей).","sec":"быстрый дешёвый фильтр на входе цепочки поставок агентов и метрика гигиены собственных репозиториев. Роль: владелец политики допуска зависимостей.","biz":"простой показатель для due diligence open-source-компонентов и вендорских SDK. Оценка видна публично через scorecard.dev и API.","lim":"Scorecard оценивает практики, а не безопасность кода: высокий балл не означает отсутствие бэкдора. Ряд проверок работает только на GitHub, поддержка GitLab частичная. Итоговый балл обманчив, правильнее смотреть отдельные проверки. Модели на Hugging Face и закрытые зависимости не покрываются.","tbd":[{"w":"Новые проверки и версия Scorecard после v5.6.0","s":"по релизам","c":"2027-03"}],"src":[{"n":"OpenSSF Scorecard (GitHub)","u":"https://github.com/ossf/scorecard"},{"n":"Scorecard checks docs","u":"https://github.com/ossf/scorecard/blob/main/docs/checks.md"},{"n":"scorecard.dev","u":"https://scorecard.dev/"},{"n":"OpenSSF: Structured Results","u":"https://openssf.org/blog/2024/04/17/beyond-scores-with-openssf-scorecard-granular-structured-results-for-custom-policy-enforcement/"}],"rel":["ZTA-01","PRT-01","SCM-01","SCM-02","THR-01","THR-03"],"lab":"OpenSSF Scorecard"},{"id":"THR-01","type":"card","domain":"THR","short":"OWASP Top 10 for Agentic Applications 2026","title":"OWASP Top 10 for Agentic Applications 2026 (ASI01–ASI10)","status":"Под наблюдением","next":"2026-12","kind":"ИБ (таксономия рисков агентных ИИ-приложений)","core":"10 категорий рисков, характерных для агентов, которые планируют, хранят память, вызывают инструменты и действуют по делегированным полномочиям. Центральный принцип: переход от least privilege к least agency, то есть ограничение автономии, а не только доступа.","jtbd":"«Мне нужен общий язык рисков агентов для threat modeling, ревью архитектуры, red teaming и отчётов совету. Тогда каждый агент проверяется по одному и тому же списку, и находки сопоставимы между командами».","level":"тактический (threat modeling, требования) / операционный (тестирование).","sec":"использовать как основной чек-лист threat modeling и red teaming агентов и как общий язык с разработчиками. Роль: владелец стандарта. Право veto на выпуск агента без пройденной матрицы ASI.","biz":"OWASP-бренд узнаваем, поэтому список удобен для договоров с вендорами («покажите покрытие ASI01–10») и для отчётов регуляторам.","lim":"Это список рисков, а не стандарт контролей и не модель зрелости. Категории пересекаются: ASI01 часто ведёт к ASI02 и ASI10. Названия в вендорских пересказах расходятся: F5 называет ASI06 «Context Management and Retrieval Manipulation», поэтому ссылаться надо на оригинал. Типичные ошибки: сводить всё к prompt injection (ASI01)","tbd":[{"w":"Следующая редакция OWASP Agentic Top 10 (текущая от 09.12.2025)","s":"ориентир: ежегодно","c":"2026-12"}],"src":[{"n":"OWASP: Top 10 for Agentic Applications 2026","u":"https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/"}],"rel":["GOV-07","ZTA-01","ZTA-06","IAM-02","IAM-03","PRT-01","PRT-02","SCM-01","THR-02","THR-03","THR-05","DEF-01","DEF-02","ASR-02"],"lab":"OWASP Agentic Top 10"},{"id":"THR-02","type":"card","domain":"THR","short":"OWASP Top 10 for LLM Applications","title":"OWASP Top 10 для LLM-приложений (OWASP Top 10 for LLM Applications, LLM01–LLM10)","status":"Под наблюдением","next":"2026-12","kind":"ИБ.","core":"список 10 самых критичных рисков приложений на базе LLM, созданный сообществом. Используется как базовая рамка для оценки рисков любого продукта на LLM.","jtbd":"«Когда команда выпускает продукт на LLM (чат-бот, RAG, ассистент), я хочу иметь общепринятый чек-лист рисков, чтобы задать требования к безопасности и рамки тестирования».","level":"тактический.","sec":"запросить DFD LLM-приложения и маппинг на LLM01–10. Участвовать в security requirements и приёмке. Роль: advisory. Veto: при открытых LLM01/LLM02/LLM05 в продукте с PII или выходом в другие системы.","biz":"подключать безопасность на этапе дизайна любой LLM-функции. Список подходит для вопросов к вендорам при закупке GenAI-решений.","lim":"покрывает LLM-приложения; агентную автономию, межагентные связи и rogue agents покрывает THR-01. Нумерация меняется между редакциями (2023, 2025, 2026), и ссылки «LLM06» без года неоднозначны. Rate limiting для LLM10: friction-контроль, по тесту ZTA-01 недостаточен. Это перечень рисков, а не стандарт контролей.","tbd":[{"w":"Полный перечень LLM01-LLM10 редакции 2026 (август 2026) для карточки","s":"опубликован, требует внесения","c":"2026-12"}],"src":[{"n":"OWASP LLM Top 10 2025","u":"https://genai.owasp.org/resource/owasp-top-10-for-llm-applications-2025/"},{"n":"OWASP GenAI LLM Top 10 2026","u":"https://genai.owasp.org/resource/owasp-genai-llm-top-10-2026/"},{"n":"PDF 2025","u":"https://owasp.github.io/www-project-top-10-for-large-language-model-applications/assets/PDF/OWASP-Top-10-for-LLMs-v2025.pdf"}],"rel":["ZTA-01","THR-01","THR-03","THR-04","TST-01"],"lab":"OWASP LLM Top 10"},{"id":"THR-03","type":"card","domain":"THR","short":"MITRE ATLAS","title":"MITRE ATLAS (Adversarial Threat Landscape for AI Systems)","status":"Под наблюдением","next":"2026-12","kind":"ИБ. База знаний тактик, техник и процедур (TTP) атакующих на ИИ-системы, устроенная по образцу ATT&CK.","core":"ATLAS: матрица «тактика (зачем атакующий что-то делает) → техника (как именно)» с кодами AML.TA* и AML.T*. К техникам привязаны реальные кейсы и меры защиты. 14 из 16 тактик взяты из ATT&CK: Reconnaissance, Initial Access, Persistence, Credential Access, Lateral Movement, Exfiltration, Impact и другие. Две тактики уникальны для ИИ: AI Model Access: уровни доступа к модели, от публичного API до полных весов","jtbd":"«Мне нужен общий с SOC, red team и threat intelligence язык TTP для атак на агентов. Тогда каждую находку, детект или инцидент можно привязать к коду техники, увидеть пробелы покрытия и сравнивать себя с реальными кампаниями».","level":"операционный (детекция, red team) и тактический (threat modeling, анализ покрытия).","sec":"ATLAS: основной TTP-словарь для SOC, red team и CTI в части агентов. Он дополняет таксономию рисков OWASP (THR-01). Роль: владелец модели покрытия детекций.","biz":"отчёт «покрыто X из 139 агентных техник» понятен совету. Вендоров EDR, SIEM и AI security стоит спрашивать, на какие коды ATLAS у них есть детекты.","lim":"База быстро растёт, и цифры в обзорах устаревают. В публичных обзорах встречаются цифры от 66 до 167 техник. CSA отмечала, что в ранних версиях v5.x не было тактик Lateral Movement и Command and Control. В текущей таксономии из 16 тактик они уже есть. Кейсы исторически во многом академические. Для части новых агентных техник ещё нет оценок.","tbd":[{"w":"Ежемесячные релизы ATLAS (текущий v2026.09)","s":"ежемесячно","c":"2026-12"}],"src":[{"n":"MITRE ATLAS","u":"https://atlas.mitre.org/"},{"n":"atlas-data: release v2026.09","u":"https://github.com/mitre-atlas/atlas-data/commit/3259f388d19cbcca11bacf12a0ef97f4198f711b"},{"n":"atlas-data: release v2026.08","u":"https://github.com/mitre-atlas/atlas-data/releases/tag/v2026.08"},{"n":"CTID: Secure AI v2","u":"https://ctid.mitre.org/blog/2026/05/06/secure-ai-v2-release/"}],"rel":["ZTA-01","IAM-02","IAM-03","PRT-01","PRT-02","SCM-01","SCM-02","THR-01","THR-02","THR-05","TST-01","VRM-01","ASR-02"],"lab":"MITRE ATLAS"},{"id":"THR-04","type":"card","domain":"THR","short":"MAESTRO (CSA)","title":"MAESTRO (Multi-Agent Environment, Security, Threat, Risk, and Outcome)","status":"Актуально","next":"2027-03","kind":"ИБ.","core":"threat modeling по 7-слойной эталонной архитектуре агентной системы. Отдельно разбираются межслойные угрозы и типовые архитектурные паттерны. Расширяет STRIDE, PASTA и LINDDUN за счёт угроз, специфичных для ИИ.","jtbd":"«Когда проектируется или ревьюится мультиагентная система, я хочу систематически вывести угрозы из её архитектуры, чтобы не упустить риски, которые классические модели не видят».","level":"тактический.","sec":"запросить архитектурную схему, разложенную по 7 слоям. Вести threat modeling workshop. Роль: advisory на этапе Design. Gate (veto): до выхода в прод при неоценённых межслойных угрозах.","biz":"привлекать безопасность на старте архитектурного дизайна агентной платформы и при добавлении нового паттерна, например перехода от одного агента к мультиагентной схеме.","lim":"это публикация в блоге, а не стандарт. Готовой шкалы риска нет, матрицу каждый строит сам. Часть примеров меток: классический ML (self-driving), а не LLM-агенты. Rate limiting в паттернах противоречит тесту «невозможно, а не утомительно» из ZTA-01. Типичная ошибка: моделировать только слой L1 и пропускать межслойные угрозы.","tbd":[{"w":"Развитие MAESTRO в стандарт или руководство CSA","s":"не объявлено","c":"2027-03"}],"src":[{"n":"CSA: Agentic AI Threat Modeling Framework: MAESTRO","u":"https://cloudsecurityalliance.org/blog/2025/02/06/agentic-ai-threat-modeling-framework-maestro"}],"rel":["ZTA-01","THR-01","THR-03","THR-05","THR-06","THR-07"],"lab":"CSA MAESTRO"},{"id":"THR-05","type":"card","domain":"THR","short":"STRIDE","title":"STRIDE (Spoofing, Tampering, Repudiation, Information Disclosure, Denial of Service, Elevation of Privilege)","status":"Актуально","next":"2027-12","kind":"ИБ.","core":"мнемоника из шести классов угроз. Каждый класс: нарушение одного свойства безопасности. Модель применяют к схеме потоков данных (DFD) на этапе проектирования, чтобы находить угрозы системно, а не полагаться на чутьё ревьюера.","jtbd":"«Когда проектируется система или новая функция, я хочу пройти по её компонентам и потокам данных по понятному чек-листу, чтобы найти угрозы до написания кода».","level":"тактический.","sec":"запросить DFD к каждому значимому изменению. Проводить threat modeling session. Роль: фасилитатор и advisory. Gate на дизайн-ревью.","biz":"закладывать threat modeling в SDLC на этапе дизайна. Позже исправления обходятся дороже.","lim":"перебирать все шесть угроз по каждому элементу долго. STRIDE не учитывает автономию агентов, поэтому появился MAESTRO (THR-04). Встроенной оценки риска нет. Модель ищет угрозы безопасности, а не приватности: для приватности есть LINDDUN. Типичные ошибки: моделировать без DFD и границ доверия, делать модель один раз и не обновлять.","tbd":[],"src":[{"n":"Microsoft Threat Modeling Tool: Threats","u":"https://learn.microsoft.com/en-us/azure/security/develop/threat-modeling-tool-threats"},{"n":"Microsoft SDL Threat Modeling","u":"https://www.microsoft.com/en-us/securityengineering/sdl/threatmodeling"}],"rel":["THR-01","THR-02","THR-03","THR-04","THR-06","THR-07","THR-08"],"lab":"STRIDE"},{"id":"THR-06","type":"card","domain":"THR","short":"LINDDUN","title":"LINDDUN (Linking, Identifying, Non-repudiation, Detecting, Data Disclosure, Unawareness, Non-compliance)","status":"Актуально","next":"2027-06","kind":"гибрид (privacy engineering / ИБ)","core":"аналог THR-05 STRIDE для приватности. Модель даёт 7 типов угроз приватности, деревья угроз и процесс работы по DFD. В STRIDE свойства: это CIA, в LINDDUN: свойства приватности из GDPR Art. 25.","jtbd":"«Когда система или ИИ-агент обрабатывает персональные данные, я хочу системно найти угрозы приватности, а не только утечки, чтобы встроить privacy by design и получить содержательный вход для DPIA».","level":"тактический.","sec":"запускать вместе с THR-05 на дизайн-ревью любой системы с PII. Роль: co-facilitator с DPO. Veto: через DPIA. Учитывать конфликт: Non-repudiation в STRIDE – защитное свойство, а в LINDDUN – угроза. Для агентов ZTA-01 требует полной атрибуции действий в логах. Значит, атрибуцию действий агента нужно сохранять, а PII пользователей в логах минимизировать.","biz":"LINDDUN GO подходит для продуктовых команд без экспертизы в приватности. Привлекать безопасность и DPO на дизайне функций с персонализацией, памятью, аналитикой.","lim":"PRO трудоёмок, как и STRIDE-per-element. Встроенной оценки риска нет. Агентная специфика (память, цепочки инструментов, мультиагентный обмен) явно не проработана. Типичные ошибки: свести всё к Data Disclosure; не учитывать метаданные (Linking, Detecting); моделировать только своё хранилище, без потоков к сторонним API.","tbd":[],"src":[{"n":"LINDDUN, официальный сайт","u":"https://linddun.org/"},{"n":"Категории угроз LINDDUN GO","u":"https://linddun.org/linddun-go-categories/"},{"n":"LINDDUN GO, карты (PDF)","u":"https://downloads.linddun.org/linddun-go/default/v0/go.pdf"},{"n":"Каталог деревьев угроз, KU Leuven (PDF)","u":"https://lirias.kuleuven.be/retrieve/d6c5aa63-5e0a-413e-a5ca-198d5a42c858"}],"rel":["GOV-04","REG-02","ZTA-01","THR-04","THR-05","THR-07"],"lab":"LINDDUN"},{"id":"THR-07","type":"card","domain":"THR","short":"PASTA","title":"PASTA (Process for Attack Simulation and Threat Analysis)","status":"Актуально","next":"2027-12","kind":"ИБ (risk-centric threat modeling)","core":"методика из 7 стадий. Она идёт от бизнес-целей через техническую декомпозицию и взгляд атакующего к количественной оценке бизнес-риска. В отличие от THR-05 STRIDE, это не таксономия угроз, а процесс, который связывает угрозы, уязвимости и атаки с бизнес-ущербом.","jtbd":"«Когда нужно обосновать приоритеты защиты на языке бизнеса, я хочу смоделировать реалистичные атаки на критичную систему и посчитать их бизнес-ущерб, чтобы руководство принимало решения о мерах и остаточном риске по существу».","level":"тактический, с выходом на стратегический в стадиях I и VII.","sec":"использовать как язык разговора с советом и CFO, потому что результат выражен в бизнес-ущербе. Сочетать с GOV-02 (уровни автономии) для агентных систем. Роль: владелец процесса. Право veto даёт стадия VII: решение о принятии остаточного риска остаётся за бизнесом, но безопасность его документирует.","biz":"бизнес-владельцу нужно участвовать в стадиях I и VII, иначе риск-ориентированность методики теряется. Безопасность стоит привлекать до архитектурных решений, а не после реализации.","lim":"Процесс трудоёмкий и требует нескольких ролей и CTI. Для небольших изменений избыточен. Стадия V относится уже к реализации, а не к дизайну, поэтому на раннем этапе её выполнить трудно. Формулировки в публикациях немного расходятся: в одних стадия VI называется Attack Analysis, в других Attack Modeling & Simulation.","tbd":[],"src":[{"n":"VerSprite: 7 Stages","u":"https://versprite.com/resources/blog/understanding-7-stages-pasta-threat-modeling/"}],"rel":["GOV-01","GOV-02","THR-01","THR-03","THR-04","THR-05","THR-06","THR-08","TST-01","VRM-04"],"lab":"PASTA"},{"id":"THR-08","type":"card","domain":"THR","short":"DREAD","title":"DREAD (Damage, Reproducibility, Exploitability, Affected users, Discoverability)","status":"Актуально","next":"2027-12","kind":"ИБ (качественная оценка угроз)","core":"каждая угроза оценивается по пяти факторам от 1 до 10. Оценки суммируют и делят на 5, получается балл от 1 до 10, по которому сортируют угрозы. DREAD не находит угрозы, а ранжирует уже найденные.","jtbd":"«Когда после STRIDE или LINDDUN есть длинный список угроз, я хочу быстро и без тяжёлой методики их отсортировать,
