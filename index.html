чтобы команда начала с самых опасных».","level":"тактический / операционный.","sec":"использовать как быстрый инструмент приоритизации на дизайн-ревью и в обучении security champions. Не использовать DREAD как единственное основание для принятия риска советом. Роль: фасилитатор.","biz":"продуктовые команды понимают модель с первого раза, поэтому она подходит для первой сортировки backlog.","lim":"Субъективность: разные люди ставят одной угрозе разные баллы, особенно в середине шкалы. Усреднение прячет катастрофу: угрозы с профилями «D=1, остальное 10» и «Disc=1, остальное 10» получают одинаковый балл (LeBlanc, 2007). Discoverability меняется за ночь: как только уязвимость опубликована, её оценка прыгает с 2 до 10.","tbd":[],"src":[{"n":"Microsoft Learn: Threat Modeling for Drivers","u":"https://learn.microsoft.com/en-us/windows-hardware/drivers/driversecurity/threat-modeling-for-drivers"}],"rel":["GOV-01","GOV-02","THR-05","THR-06","THR-07","VRM-04"],"lab":"DREAD"},{"id":"DEF-01","type":"card","domain":"DEF","short":"Spotlighting и constitutional classifiers","title":"Spotlighting и constitutional classifiers: защита от prompt injection","status":"Актуально","next":"2027-03","kind":"ИБ, защитные паттерны на границе между входом и выходом агента.","core":"модели не могут надёжно отличить информационный контекст от инструкций, которые нужно выполнить. Spotlighting помогает модели различать системные инструкции и пользовательский вход, считая вход менее доверенным. Известны три режима: delimiting (метки-границы), datamarking (спецсимвол между словами недоверенного текста) и encoding (например, Base64 с указанием модели только читать).","jtbd":"«Мой агент читает письма, веб-страницы, PDF и выдачу RAG. Нужно, чтобы спрятанная там инструкция (\"перешли все письма на…\") не стала командой. Если что-то всё же прошло, это нужно поймать до действия».","level":"операционный и технический (архитектура агента).","sec":"это основной технический ответ на ASI01 и indirect injection, его эффект можно измерить метриками red team. Роль CISO: требование многослойной защиты для агентов, принимающих внешний контент.","biz":"агентам можно безопаснее давать доступ к почте, вебу и документам. Плата за это: задержка и стоимость guard-вызовов, а ложные отказы нужно отслеживать как продуктовую метрику.","lim":"Ни один фильтр не даёт 100%: адаптивные атаки обходят и spotlighting, и классификаторы. Входная санитизация не переносится напрямую из классической ИБ: вход свободный и непредсказуемый, как в SQL injection тут не получится. Типичные ошибки: считать классификатор границей безопасности вместо least agency","tbd":[{"w":"Новые независимые замеры эффективности против адаптивных атак","s":"нет данных","c":"2027-03"}],"src":[{"n":"Anthropic: Zero Trust for AI Agents (PDF, 18.05.2026)","u":"https://cdn.prod.website-files.com/6889473510b50328dbb70ae6/6a1611a04085d7cd3dadc924_Claude-eBook-Zero-Trust-for-AI-Agents-05182026.pdf"},{"n":"Microsoft Research: Defending Against Indirect Prompt Injection Attacks With Spotlighting (arXiv)","u":"https://arxiv.org/abs/2403.14720"}],"rel":["ZTA-01","PRT-01","THR-01","THR-03","DEF-02","TST-02","VRM-01"],"lab":"Spotlighting"},{"id":"DEF-02","type":"card","domain":"DEF","short":"CaMeL и Dual LLM","title":"CaMeL и Dual LLM: архитектурная защита от prompt injection","status":"Актуально","next":"2027-03","kind":"ИБ, архитектурный паттерн агента (security by design). Это не фильтр, а ограничение потоков управления и данных.","core":"Privileged LLM принимает вход только из доверенных источников (от пользователя) и имеет доступ к инструментам. Quarantined LLM работает с недоверенным контентом, не имеет инструментов и в любой момент считается потенциально скомпрометированным. Ключевое правило: необработанный вывод Quarantined LLM никогда не передаётся в Privileged LLM. Привилегированная модель оперирует символическими ссылками вроде $VAR1 и может попросить показать их пользователю, но сама содержимое не видит. Controller: обычное ПО, не LLM.","jtbd":"«Фильтры (DEF-01) снижают успех инъекций, но не дают гарантий. Мне нужна архитектура, где даже успешная инъекция в прочитанном письме физически не может изменить действия агента или отправить данные не туда».","level":"архитектурный и технический.","sec":"даёт архитектурную гарантию против ASI01 и эксфильтрации там, где фильтры дают только вероятность. Это прямое применение теста из книги: атака становится невозможной, а не просто трудоёмкой.","biz":"позволяет безопаснее подключать агентов к почте, вебу и документам клиентов. Цена: падение полезности примерно на 7–12 п.п., задержки и сложность разработки.","lim":"Dual LLM сам по себе не даёт доказуемой безопасности. Задачи, где недоверенные данные должны определять действие («сделай то, что написано в тикете»), плохо ложатся на паттерн. Политики потоков данных нужно писать и поддерживать вручную. Типичные ошибки: передавать вывод Quarantined LLM в Privileged свободным текстом","tbd":[{"w":"Продуктовые реализации CaMeL-подобных схем","s":"нет данных","c":"2027-03"}],"src":[{"n":"arXiv: Defeating Prompt Injections by Design","u":"https://arxiv.org/abs/2503.18813"},{"n":"Simon Willison: Dual LLM pattern","u":"https://simonwillison.net/2023/Apr/25/dual-llm-pattern/"},{"n":"Simon Willison: обзор паттернов защиты","u":"https://simonwillison.net/2025/Jun/13/prompt-injection-design-patterns/"},{"n":"arXiv: Design Patterns for Securing LLM Agents","u":"https://arxiv.org/html/2506.08837v1"}],"rel":["ZTA-01","PRT-01","THR-01","THR-03","DEF-01","TST-02"],"lab":"CaMeL / Dual LLM"},{"id":"TST-01","type":"card","domain":"TST","short":"OWASP GenAI Red Teaming Guide и Manual","title":"OWASP GenAI Red Teaming (GenAI Red Teaming Guide v1.0, 2025 + GenAI Red Teaming Manual v1.0, 2026)","status":"Под наблюдением","next":"2027-01","kind":"ИБ.","core":"методика red teaming для GenAI-систем, основанная на рисках. Охватывает уровень модели (токсичность, bias), системный уровень (злоупотребление API, утечки данных) и агентов.","jtbd":"«Когда LLM-приложение или агент готовится к релизу или меняется, я хочу провести воспроизводимое состязательное тестирование, чтобы найти уязвимости до атакующих и превратить находки в детекции и регрессионные тесты».","level":"операционный / тактический.","sec":"заказать или провести red teaming до релиза и после каждого существенного изменения, например нового источника в RAG или новой модели. Роль: исполнитель. Veto: на релиз при критичных воспроизводимых находках.","biz":"закладывать red teaming в план релиза и бюджет. При выборе подрядчика использовать OWASP Vendor Evaluation Criteria.","lim":"без threat model тесты получаются хаотичными; Guide советует сначала определить свои риски. Разовое тестирование бесполезно: ни одна модель не бывает окончательно «готовой» или «безопасной». Ещё одна ошибка: путать Guide (2025, концептуальный) и Manual (2026, методика). Результаты недетерминированы, поэтому нужны метрики вроде pass@k.","tbd":[{"w":"Точная дата и обновления GenAI Red Teaming Manual v1.0 (2026)","s":"нет данных","c":"2027-01"}],"src":[{"n":"OWASP GenAI Red Teaming Guide","u":"https://genai.owasp.org/resource/genai-red-teaming-guide/"},{"n":"Announcement","u":"https://genai.owasp.org/2025/01/22/announcing-the-owasp-gen-ai-red-teaming-guide/"},{"n":"GenAI Red Teaming Manual v1.0","u":"https://genai.owasp.org/resource/genai-red-teaming-manual-version-1-0/"}],"rel":["ZTA-01","THR-01","THR-02","THR-03","THR-04","TST-02","ASR-02"],"lab":"OWASP GenAI Red Teaming"},{"id":"TST-02","type":"card","domain":"TST","short":"AgentDojo","title":"AgentDojo: бенчмарк устойчивости агентов к prompt injection","status":"Актуально","next":"2027-03","kind":"ИБ. Это среда для измерения и тестирования атак и защит агентов, которые вызывают инструменты на недоверенных данных.","core":"агент решает реалистичные задачи через инструменты, а в их выдаче спрятаны инструкции атакующего. После прогона AgentDojo проверяет реальное состояние среды: выполнил ли агент задачу пользователя, задачу атакующего или обе. Объём: 97 задач и 629 тест-кейсов безопасности. Среды (suites) в версии Inspect: Workspace Plus (42 пользовательские задачи и 15 задач инъекции), Slack (20 и 5), Travel (20 и 7), Banking (16 и 9). Оценка идёт по функциям, которые проверяют состояние среды, а не через LLM-судью.","jtbd":"«Я выбираю модель и защиты (DEF-01, DEF-02) для агента. Нужны воспроизводимые цифры: насколько упадёт полезность, на сколько снизится успех атак, и прошла ли регрессия после смены модели или промпта».","level":"технический и операционный (оценка, регрессия).","sec":"превращает «мы защищены от injection» в измеримую метрику с базовой линией и регрессией. Роль security: задать пороги и владеть собственными средами.","biz":"даёт прозрачный выбор между полезностью и безопасностью, с цифрами для решения о модели и паттерне. Это доказательство «должной осмотрительности» для аудитора и регулятора.","lim":"Стандартные среды не отражают ваш домен и инструменты. Атаки в основном статичные, а реальные противники адаптивны. Бенчмарк проверяет только indirect injection через выдачу инструментов. Отравление памяти, supply chain и мультиагентность покрыты слабо. Результаты чувствительны к версии модели и промпту, это не официальный лидерборд.","tbd":[{"w":"Новые среды и адаптивные атаки в AgentDojo / Inspect","s":"по релизам","c":"2027-03"}],"src":[{"n":"AgentDojo (SPY Lab)","u":"https://agentdojo.spylab.ai/"},{"n":"arXiv: AgentDojo","u":"https://arxiv.org/html/2406.13352v1"},{"n":"Результаты AgentDojo","u":"https://agentdojo.spylab.ai/results/"},{"n":"UK AISI Inspect Evals: AgentDojo","u":"https://ukgovernmentbeis.github.io/inspect_evals/evals/agentdojo/index.html"}],"rel":["GOV-01","GOV-03","THR-01","THR-03","DEF-01","DEF-02","TST-01","VRM-04"],"lab":"AgentDojo"},{"id":"VRM-01","type":"card","domain":"VRM","short":"OWASP AIVSS","title":"OWASP AIVSS (AI Vulnerability Scoring System)","status":"Под наблюдением","next":"2026-12","kind":"ИБ. Система оценки тяжести уязвимостей в агентных ИИ-системах, построенная как расширение CVSS.","core":"одна и та же техническая уязвимость опаснее в агенте с автономией, инструментами и памятью. Агентные возможности работают как множитель силы для уязвимости. Поэтому CVSS служит нижней границей риска, а сверху к нему добавляется агентная надбавка (Agentic Uplift).","jtbd":"«CVSS даёт prompt injection в агенте с правом выплат такую же оценку, как в чат-боте без инструментов. Мне нужна стандартная оценка с учётом автономии, инструментов, памяти и мультиагентности, чтобы приоритизировать исправления и SLA по реальному риску».","level":"операционный (триаж находок) и тактический (приоритизация, SLA).","sec":"даёт единую шкалу приоритизации агентных уязвимостей и количественно обосновывает least agency. Роль: владелец методики оценки.","biz":"понятное совету объяснение, почему одинаковый баг в разных агентах требует разного бюджета и срока. Связка с AIUC-1 помогает в сертификации и страховании.","lim":"Стандарт ещё не устоялся: модели v0.8 и v1.0 сильно различаются. Оценка агентных факторов субъективна. Сторонние калькуляторы могут считать по старой формуле. Типичные ошибки: смешивать баллы v0.8 и v1.0 в одном отчёте; не фиксировать версию и вектор; опускать итог ниже CVSS-BTE: в v1.0 это запрещено","tbd":[{"w":"AIVSS v1.0: финальная версия (кандидат с августа 2026)","s":"план: до конца 2026","c":"2026-12"}],"src":[{"n":"OWASP AIVSS","u":"https://aivss.owasp.org/"},{"n":"AIVSS 1.0 Calculator","u":"https://aivss.owasp.org/calculator/"},{"n":"AIVSS v1.0 Candidate (GitHub)","u":"https://github.com/kenhuangus/aivss-v1-candidate"},{"n":"AIVSS × AIUC-1 crosswalk","u":"https://aivss.owasp.org/aiuc-aivss-crosswalk"}],"rel":["GOV-07","ZTA-01","ZTA-06","THR-01","THR-03","VRM-02","VRM-03","VRM-04","ASR-01"],"lab":"OWASP AIVSS"},{"id":"VRM-02","type":"card","domain":"VRM","short":"SEI SSVC","title":"SEI SSVC (Stakeholder-Specific Vulnerability Categorization)","status":"Под наблюдением","next":"2027-01","kind":"ИБ. Методика приоритизации уязвимостей: вместо балла дерево решений выдаёт конкретное действие.","core":"аналитик последовательно отвечает на вопросы о точках решения и получает одно из четырёх действий. Правило приоритета: эксплуатация > техническое влияние > автоматизируемость > влияние на миссию и благополучие → решение. Методика называется stakeholder-specific, потому что для разных ролей есть разные деревья: deployer, supplier, coordinator.","jtbd":"«У меня сотни находок с CVSS 7+, и все они \"high\". Нужно понятное и воспроизводимое правило: что чинить сегодня, что в этом спринте, а что просто мониторить, с учётом реальной эксплуатации и важности системы для бизнеса».","level":"операционный (триаж) и тактический (политика SLA).","sec":"превращает поток находок в понятные действия и SLA, убирает споры вида «CVSS 7.5: это срочно?». Роль: владелец дерева решений и порогов.","biz":"решение Act автоматически запускает эскалацию руководству, что прозрачно для совета. Методика совместима с требованиями BOD 26-04.","lim":"Нужны качественные данные об эксплуатации и активах, без них дерево выдаёт мусор. Для агентов стандартные точки решения не учитывают автономию и память, поэтому SSVC стоит дополнять AIVSS. Деревья разных ролей и версий различаются, а пакет certcc-ssvc пока в beta. Типичные ошибки: использовать SSVC как ещё один балл, а не как решение","tbd":[{"w":"Стабильный релиз пакета certcc-ssvc (сейчас beta)","s":"не объявлен","c":"2027-01"}],"src":[{"n":"SSVC (CERT/CC)","u":"https://certcc.github.io/SSVC/"},{"n":"CISA: SSVC","u":"https://www.cisa.gov/resources-tools/resources/stakeholder-specific-vulnerability-categorization-ssvc"}],"rel":["ZTA-01","SCM-01","THR-01","THR-03","VRM-01","VRM-03","VRM-04"],"lab":"SEI SSVC"},{"id":"VRM-03","type":"card","domain":"VRM","short":"EPSS и CISA KEV","title":"EPSS и CISA KEV: данные об эксплуатации для приоритизации","status":"Под наблюдением","next":"2026-12","kind":"ИБ, threat intelligence для vulnerability management.","core":"EPSS: вероятность 0–1 и перцентиль относительно всех CVE. Значения калиброваны: 0.05 соответствует реальным 5% эксплуатаций за 30 дней. Окно в 30 дней выбрано под цикл Patch Tuesday. KEV: бинарный факт «эксплуатация подтверждена». Записи появляются только при доказательствах активной эксплуатации. CISA рекомендует использовать KEV как вход в собственную методику приоритизации.","jtbd":"«Из тысяч CVE в моих зависимостях агентов нужно быстро выбрать те, которые реально атакуют сейчас или скоро начнут. Тогда команда чинит десятки, а не тысячи, и не пропускает критичное».","level":"операционный (ежедневный триаж).","sec":"EPSS и KEV: основной источник фактов об эксплуатации для SSVC и SLA. Матрица BOD 26-04: готовая политика, которую можно взять за основу. Роль: владелец конвейера обогащения.","biz":"сроки по реальному риску вместо «все high за 30 дней» снижают нагрузку на команды. Это понятный, публично обоснованный стандарт для аудиторов и совета.","lim":"EPSS и KEV покрывают только CVE, а у агентных уязвимостей (prompt injection, отравление памяти) их обычно нет. EPSS не оценивает тяжесть и ваш контекст, KEV запаздывает. BOD 26-04 обязательна только для федеральных агентств США. Типичные ошибки: считать низкий EPSS гарантией безопасности; использовать EPSS вместо CVSS или AIVSS, а не вместе с ними","tbd":[{"w":"BOD 26-04: срок выхода федеральных агентств на новые сроки","s":"2026-12-07","c":"2026-12"},{"w":"Новая версия EPSS после v4 (март 2025)","s":"не объявлена","c":"2027-03"}],"src":[{"n":"FIRST: как работает EPSS","u":"https://www.first.org/epss/how-it-works"},{"n":"CISA KEV Catalog","u":"https://www.cisa.gov/known-exploited-vulnerabilities-catalog"},{"n":"CISA BOD 26-04","u":"https://www.cisa.gov/news-events/directives/bod-26-04-prioritizing-security-updates-based-risk"},{"n":"BOD 26-04: Implementation Guidance","u":"https://www.cisa.gov/news-events/directives/bod-26-04-implementation-guidance-prioritizing-security-updates-based-risk"}],"rel":["ZTA-01","IAM-03","SCM-01","SCM-03","THR-03","VRM-01","VRM-02","VRM-04"],"lab":"EPSS / CISA KEV"},{"id":"VRM-04","type":"card","domain":"VRM","short":"FAIR (FAIR-AIR, FAIR-CAM, FAIR-MAM)","title":"FAIR (Factor Analysis of Information Risk) с расширениями FAIR-AIR, FAIR-CAM и FAIR-MAM","status":"Актуально","next":"2027-03","kind":"риск-менеджмент. FAIR: количественная оценка киберриска в деньгах и вероятностях.","core":"Risk = Loss Event Frequency × Loss Magnitude. Обе величины задаются распределениями, а не точечными числами. LEF (частота событий ущерба) = TEF (частота попыток угрозы) × Vulnerability, то есть доля попыток, которые приводят к ущербу. Итог моделируется методом Монте-Карло.","jtbd":"«Совет спрашивает, сколько нам может стоить агент выплат и окупится ли контроль за 60 тыс. € в год. Мне нужен ответ в евро и вероятностях, а не \"high / medium / low\", чтобы сравнивать риск агентов с другими бизнес-рисками и обосновать бюджет».","level":"стратегический (бюджет, risk appetite) и тактический (выбор контролей).","sec":"FAIR переводит находки из AIVSS, SSVC, ATLAS и OWASP на язык денег. Это основной аргумент за бюджет и за least agency. Роль: поставщик данных о TEF и Vulnerability и соавтор сценариев.","biz":"риск выражается так, как его уже понимает совет: в деньгах и вероятностных диапазонах. Модель помогает выбирать между контролем и страхованием и объяснять CISO как партнёра внедрения ИИ, а не помеху.","lim":"Результат хорош настолько, насколько хороши оценки. Для агентов исторических данных мало, и диапазоны получаются широкими. Исходный FAIR-AIR писался под GenAI, а агентные расширения только формируются. Трудоёмкость: оценивать каждую уязвимость нерационально. FAIR нужен для сценариев верхнего уровня, а не для триажа CVE, для которого есть SSVC (VRM-02).","tbd":[{"w":"Агентные расширения FAIR-AIR (FAIR Institute, 2026)","s":"в разработке","c":"2027-03"}],"src":[{"n":"The Open Group: Open FAIR Body of Knowledge","u":"https://www.opengroup.org/open-fair"},{"n":"FAIR Institute: FAIR-AIR, риски GenAI","u":"https://www.fairinstitute.org/ai-risk"},{"n":"FAIR Institute: агентный ИИ и FAIR-CAM","u":"https://www.fairinstitute.org/blog/taming-agentic-ai-risks-with-fair-cam"},{"n":"FAIR Institute: терминология TEF и Vulnerability","u":"https://www.fairinstitute.org/blog/fair-terminology-101-risk-threat-event-frequency-and-vulnerability"}],"rel":["GOV-01","REG-01","ZTA-01","THR-01","THR-03","THR-07","VRM-01","VRM-02","VRM-03"],"lab":"FAIR"},{"id":"ASR-01","type":"card","domain":"ASR","short":"AIUC-1","title":"AIUC-1: сертификация и страхование ИИ-агентов","status":"Под наблюдением","next":"2027-01","kind":"assurance и сертификация. Это стандарт безопасности, надёжности и безвредности (security, safety, reliability) именно для агентов, совмещённый с живым …","core":"стандарт сертифицирует конкретный агентный use case, а не организацию целиком. Этим он отличается от ISO 42001. Объём: 51 требование и 130 контролей в шести доменах. Главное отличие: поведение агента проверяют живым тестированием, а не только по политикам. Используются сотни комбинаций рисков и атак. Аккредитованные аудиторы оценивают и дают рекомендацию, а сертификат выдаёт Certification Committee AIUC. Стандарт сопоставлен с ISO 42001, EU AI Act, NIST AI RMF, OWASP и MITRE ATLAS.","jtbd":"«Enterprise-клиент требует доказательств, что наш агент безопасен. Или я покупаю агента у вендора и не знаю, как его проверить. Нужен независимый сертификат с реальным тестированием поведения и возможность застраховать остаточный риск».","level":"стратегический (доверие на рынке, страхование) и тактический (контроли, тесты).","sec":"независимое подтверждение, что контроли агентов работают под атакой, а не только существуют на бумаге. При закупке: понятный критерий проверки вендоров.","biz":"ускоряет enterprise-продажи и даёт возможность страхования. Единый аудит SOC 2 + AIUC-1 снижает нагрузку.","lim":"Это частный стандарт, а не ISO и не гармонизированный стандарт ЕС. Презумпции соответствия AI Act он не даёт. Сертификат действует только для конкретного use case. Тестирование централизовано у AIUC, поэтому есть зависимость от одного провайдера. Стандарт молодой и обновляется ежеквартально.","tbd":[{"w":"Квартальное обновление AIUC-1 (текущий релиз 15.07.2026)","s":"ежеквартально","c":"2027-01"},{"w":"Масштабирование совместного аудита AICPA + AIUC","s":"с октября 2026","c":"2027-03"}],"src":[{"n":"AIUC","u":"https://aiuc.com/"}],"rel":["GOV-01","GOV-03","GOV-04","GOV-07","REG-01","THR-01","THR-03","DEF-01","DEF-02","TST-02","VRM-04","ASR-02"],"lab":"AIUC-1"},{"id":"ASR-02","type":"card","domain":"ASR","short":"OWASP Vendor Evaluation Criteria for AI Red Teaming","title":"OWASP Vendor Evaluation Criteria for AI Red Teaming Providers & Tooling v1.0","status":"Актуально","next":"2027-02","kind":"ИБ (закупка и оценка поставщиков AI red teaming)","core":"практическое руководство, которое помогает отличить содержательное состязательное тестирование от поверхностных предложений «только джейлбрейки». Включает 13 категорий оценки, green и red flags, вопросы для discovery, чек-лист для оценки. Каждая категория разбита на критерии для простых и для продвинутых систем.","jtbd":"«Когда я выбираю подрядчика или инструмент для AI red teaming агентной системы, я хочу понятными критериями отсеять тех, кто продаёт готовые джейлбрейк-библиотеки, чтобы платить за тестирование, которое находит реальные риски моих инструментов, памяти и агентов».","level":"тактический (закупка и TPRM).","sec":"использовать как стандартный шаблон для RFP на AI red teaming и как критерий приёмки отчётов. Роль: владелец закупочной оценки. Право veto: не принимать поставщика с red flags.","biz":"закупке документ даёт объективные критерии вместо маркетинговых обещаний. Привлекать безопасность к любой закупке «AI security testing».","lim":"Версия первая (v1.0) и формирующаяся. Бенчмарков и шкал оценки поставщиков в документе нет; в материалах проекта упоминаются лишь шаблоны для оценки. Вендорские сравнения по этим критериям часто пишут сами вендоры. Типичные ошибки: выбирать по числу «атак»; тестировать агентную систему как чат-бот; принимать оценку без транскриптов","tbd":[{"w":"Версия после v1.0 (январь 2026)","s":"не объявлена","c":"2027-02"}],"src":[{"n":"OWASP: Vendor Evaluation Criteria v1.0","u":"https://genai.owasp.org/resource/owasp-vendor-evaluation-criteria-for-ai-red-teaming-providers-tooling-v1-0/"},{"n":"OWASP AI Red Teaming Initiative","u":"https://genai.owasp.org/initiatives/ai-red-teaming-initiative/"}],"rel":["GOV-07","REG-04","ZTA-06","THR-01","THR-02","THR-03","THR-07","TST-01","ASR-01"],"lab":"OWASP AI RT Vendor Criteria"}],"links":[{"source":"GOV-01","target":"GOV","t":"d"},{"source":"GOV-02","target":"GOV","t":"d"},{"source":"GOV-03","target":"GOV","t":"d"},{"source":"GOV-04","target":"GOV","t":"d"},{"source":"GOV-05","target":"GOV","t":"d"},{"source":"GOV-06","target":"GOV","t":"d"},{"source":"GOV-07","target":"GOV","t":"d"},{"source":"REG-01","target":"REG","t":"d"},{"source":"REG-02","target":"REG","t":"d"},{"source":"REG-03","target":"REG","t":"d"},{"source":"REG-04","target":"REG","t":"d"},{"source":"ZTA-01","target":"ZTA","t":"d"},{"source":"ZTA-02","target":"ZTA","t":"d"},{"source":"ZTA-03","target":"ZTA","t":"d"},{"source":"ZTA-04","target":"ZTA","t":"d"},{"source":"ZTA-05","target":"ZTA","t":"d"},{"source":"ZTA-06","target":"ZTA","t":"d"},{"source":"IAM-01","target":"IAM","t":"d"},{"source":"IAM-02","target":"IAM","t":"d"},{"source":"IAM-03","target":"IAM","t":"d"},{"source":"PRT-01","target":"PRT","t":"d"},{"source":"PRT-02","target":"PRT","t":"d"},{"source":"SCM-01","target":"SCM","t":"d"},{"source":"SCM-02","target":"SCM","t":"d"},{"source":"SCM-03","target":"SCM","t":"d"},{"source":"THR-01","target":"THR","t":"d"},{"source":"THR-02","target":"THR","t":"d"},{"source":"THR-03","target":"THR","t":"d"},{"source":"THR-04","target":"THR","t":"d"},{"source":"THR-05","target":"THR","t":"d"},{"source":"THR-06","target"   sec('Суть',c.core)+sec('Какую задачу решает',c.jtbd,'q')+sec('Уровень',c.level)+sec('Для безопасности',c.sec)+sec('Для бизнеса и ИТ',c.biz)+sec('Ограничения',c.lim)+
  (c.tbd.length?'<div class="nrg-sec"><h4>Ожидаемые изменения</h4><table class="nrg-tbd">'+c.tbd.slice().sort(function(a,b){return a.c<b.c?-1:1}).map(function(t){return '<tr><td class="c">'+t.c+'</td><td>'+esc(t.w)+'</td><td class="s">'+esc(t.s)+'</td></tr>'}).join('')+'</table></div>':'')+
  (c.rel.length?'<div class="nrg-sec"><h4>Связанные карточки</h4><div class="nrg-rel">'+c.rel.map(function(r){return '<button type="button" data-id="'+r+'" title="'+esc(byId[r]?byId[r].short:'')+'">'+r+'</button>'}).join('')+'</div></div>':'')+
  (c.src.length?'<div class="nrg-sec nrg-src"><h4>Первоисточники</h4>'+c.src.map(function(s){return '<a href="'+esc(s.u)+'" target="_blank" rel="noopener">'+esc(s.n)+' ↗</a>'}).join('')+'</div>':'');wire()}
 function raiseSel(){if(!sel)return;var hl=nb[sel.id];nodeSel.filter(function(m){return m.type==='card'&&(m===sel||hl.has(m.id))}).raise()}
 function select(n,fromPanel){sel=n;setTimeout(raiseSel,0);if(!n)overview();else if(n.type==='domain')domainView(n);else cardView(n);paint();if(n&&window.innerWidth<=900&&!fromPanel){panel.scrollIntoView({behavior:'smooth',block:'start'})}}
 nodeSel.on('mouseenter',function(e,n){hov=n;paint()}).on('mouseleave',function(){if(hov){hov=null;paint()}});
 nodeSel.on('click',function(e,n){e.stopPropagation();select(sel===n?null:n)}).on('keydown',function(e,n){if(e.key==='Enter')select(n)});
 svg.on('click',function(){if(sel)select(domF?byId[domF]:null)});
 document.getElementById('nrg-q').addEventListener('input',function(e){q=e.target.value.trim().toLowerCase();paint();
  if(q){var m=cards.filter(visible);if(m.length===1)select(m[0])}});
 document.getElementById('nrg-reset').onclick=function(){domF=null;q='';document.getElementById('nrg-q').value='';chips();select(null);fit()};
 chips();select(null);
 var to;window.addEventListener('resize',function(){clearTimeout(to);to=setTimeout(function(){var w=stage.clientWidth,h=stage.clientHeight-30;if(Math.abs(w-W)<40&&Math.abs(h-H)<40)return;W=w;H=h;anchors();sim.alpha(.5).restart();setTimeout(function(){placeLabels();fit()},700)},200)});
}
if(window.d3&&window.d3.forceSimulation)boot();else{var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js';s.onload=boot;document.head.appendChild(s)}
})();
